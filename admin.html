<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Mal3ab</title>
<link rel="stylesheet" href="shared/style.css?v=1793401000">
<style>#reqs[hidden] { display: none; }</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="shared/i18n.js?v=1793401000"></script>
<script src="shared/net.js?v=1793404000"></script>
</head>
<body>
<div class="topbar">
  <a class="back" href="play.html" data-i18n="home"></a>
  <div class="title" data-i18n="admin"></div>
  <div class="room" id="count"></div>
  <span id="langslot"></span>
</div>
<div class="page" style="max-width:1100px">
  <div class="panel2" id="reqs" hidden></div>
  <div class="panel2">
    <div class="row2"><h2 data-i18n="users"></h2><label style="display:flex;align-items:center;gap:6px;margin-inline-start:auto;cursor:pointer"><input type="checkbox" id="onlyOn" style="width:auto;margin:0"><span data-i18n="adm_onlyOn"></span></label><input class="text" id="q" data-i18n-ph="searchUsers" style="max-width:320px"></div>
    <div class="err" id="err"></div>
    <div style="overflow-x:auto"><table class="users" id="tbl"></table></div>
  </div>
</div>
<script>
addStrings({ adm_reqT: 'طلبات الأدمن', adm_approve: '✅ اقبل', adm_decline: '❌ ارفض', adm_noReason: 'من غير سبب', adm_owner: 'المالك', adm_status: 'الحالة',
             adm_on: 'أونلاين دلوقتي', adm_off: 'مش أونلاين', adm_ago: 'آخر ظهور {t}', adm_onlyOn: 'الأونلاين بس', adm_nOn: '{n} أونلاين' },
           { adm_reqT: 'Admin Requests', adm_approve: '✅ Approve', adm_decline: '❌ Decline', adm_noReason: 'No reason given', adm_owner: 'Owner', adm_status: 'Status',
             adm_on: 'Online Now', adm_off: 'Offline', adm_ago: 'Last seen {t}', adm_onlyOn: 'Online Only', adm_nOn: '{n} online' });
// online = the site is open: every open page pings the server every 30 s (net.js "touch"), so a ping in the last ~2 min means online
const isOn = (u) => !!u.last_seen && Date.now() - new Date(u.last_seen).getTime() < 2 * 60 * 1000;
function ago(d) {
  const s = Math.max(0, (Date.now() - new Date(d).getTime()) / 1000), ar = getLang() === 'ar';
  const rt = new Intl.RelativeTimeFormat(ar ? 'ar-EG' : 'en', { numeric: 'auto' });
  if (s < 3600) return rt.format(-Math.round(s / 60), 'minute');
  if (s < 86400) return rt.format(-Math.round(s / 3600), 'hour');
  if (s < 30 * 86400) return rt.format(-Math.round(s / 86400), 'day');
  return fmtDate(d);
}
let USERS = [];
async function loadReqs() {
  const box = document.getElementById('reqs');
  try {
    const { data, error } = await sb.rpc('admin_requests_list', { p_token: Auth.token }); if (error) throw error;
    box.hidden = !data || !data.length; if (box.hidden) return;
    box.innerHTML = `<h2>🛡️ ${t('adm_reqT')} (${data.length})</h2>` + data.map(r => `<div class="row2" style="gap:10px;padding:8px 0;border-top:1px solid #ffffff14">${avatarHtml(r, 34)}
      <div style="flex:1;min-width:0"><b>${esc(r.username)}</b> <small style="color:var(--muted)">${fmtDate(r.at)}</small><div dir="auto" style="color:var(--muted)">${esc(r.reason) || t('adm_noReason')}</div></div>
      <button class="btn tiny" onclick="decide('${r.id}', true)">${t('adm_approve')}</button><button class="btn tiny secondary" onclick="decide('${r.id}', false)">${t('adm_decline')}</button></div>`).join('');
  } catch (e) { box.hidden = true; }
}
async function decide(id, ok) {
  try { const { error } = await sb.rpc('admin_request_decide', { p_token: Auth.token, p_target: id, p_approve: ok }); if (error) throw error; await load(); }
  catch (e) { document.getElementById('err').textContent = e.message; }
}
const fmtDate = (d) => d ? new Date(d).toLocaleString(getLang() === 'ar' ? 'ar-EG' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : t('never');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function load() {
  document.getElementById('langslot').innerHTML = langButton(); applyLang();
  const err = document.getElementById('err');
  if (!Auth.profile || !Auth.profile.is_admin) { document.getElementById('tbl').innerHTML = ''; err.textContent = Auth.profile ? t('adminsOnly') : t('loginFirst'); return; }
  try { USERS = await Admin.users(); err.textContent = ''; } catch (e) { err.textContent = e.message; return; }
  draw(); loadReqs();
}
function draw() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const onlyOn = document.getElementById('onlyOn').checked;
  const list = USERS.filter(u => (!q || u.username.toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q)) && (!onlyOn || isOn(u)))
    .sort((a, b) => (b.is_owner - a.is_owner) || (isOn(b) - isOn(a)));
  document.getElementById('count').innerHTML = `${USERS.length} ${t('users')} · <span style="color:#80ed99">● ${t('adm_nOn', { n: USERS.filter(isOn).length })}</span>`;
  const me = Auth.user.id;
  document.getElementById('tbl').innerHTML = `<tr><th></th><th>${t('username')}</th><th>${t('email')}</th><th>${t('stats')}</th><th>${t('joined')}</th><th>${t('adm_status')}</th><th></th></tr>` +
    list.map(u => `<tr>
      <td>${avatarHtml(u, 34)}</td>
      <td><b>${esc(u.username)}</b>${u.id === me ? ` <small>(${t('you')})</small>` : ''}${u.is_owner ? `<span class="badge admin" style="background:#ffb703;color:#1a1200">👑 ${t('adm_owner')}</span>` : u.is_admin ? `<span class="badge admin">${t('adminBadge')}</span>` : ''}${u.banned ? `<span class="badge banned" title="${esc(u.ban_reason)}">${t('bannedBadge')}: ${esc(u.ban_reason)}</span>` : ''}</td>
      <td>${esc(u.email || '—')}</td>
      <td>${u.wins ?? 0} / ${u.losses ?? 0} / ${u.draws ?? 0}</td>
      <td>${fmtDate(u.created_at)}</td>
      <td style="white-space:nowrap">${isOn(u) ? `<span style="color:#80ed99;font-weight:700"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#80ed99;box-shadow:0 0 6px #80ed99"></i> ${t('adm_on')}</span>`
        : `<span style="color:var(--muted)"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#555"></i> ${u.last_seen ? t('adm_ago', { t: ago(u.last_seen) }) : t('adm_off')}</span>`}</td>
      <td><div class="acts">${u.id === me || u.is_owner ? '' : `
        ${u.banned ? `<button class="btn tiny secondary" onclick="act('${u.id}','unban')">${t('unban')}</button>` : `<button class="btn tiny" style="background:var(--p1);color:#fff" onclick="ban('${u.id}')">${t('ban')}</button>`}
        ${u.is_admin ? `<button class="btn tiny secondary" onclick="act('${u.id}','remove_admin')">${t('removeAdmin')}</button>` : `<button class="btn tiny" onclick="act('${u.id}','make_admin')">${t('makeAdmin')}</button>`}
        <button class="btn tiny secondary" onclick="del('${u.id}')">${t('deleteUser')}</button>`}</div></td>
    </tr>`).join('');
}
async function act(id, action, reason) {
  try { await Admin.act(id, action, reason); await load(); } catch (e) { document.getElementById('err').textContent = e.message; }
}
function ban(id) { const r = prompt(t('banReason'), getLang() === 'ar' ? 'غش' : 'cheating'); if (r !== null) act(id, 'ban', r); }
function del(id) { const u = USERS.find(x => x.id === id); if (confirm(t('confirmDeleteUser', { p: u ? u.username : '' }))) act(id, 'delete'); }
document.getElementById('q').addEventListener('input', draw);
document.getElementById('onlyOn').addEventListener('change', draw);
setInterval(async () => { if (document.hidden || !Auth.profile || !Auth.profile.is_admin) return; try { USERS = await Admin.users(); draw(); } catch (e) {} }, 30000);   // keep the online dots fresh
document.addEventListener('langchange', () => { load(); });
Auth.init().then(load);
</script>
</body>
</html>
