<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملعب — Mal3ab</title>
<link rel="stylesheet" href="shared/style.css?v=1793356220">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="shared/i18n.js?v=1793356220"></script>
<script src="shared/net.js?v=1793356220"></script>
</head>
<body>
<div class="topbar">
  <div class="title">🎮 <span data-i18n="app"></span> <span class="ver" data-ver>v1.0</span></div>
  <div class="room" id="who"></div>
  <button class="btn small secondary" onclick="openFriends()" data-i18n="friends"></button>
  <button class="btn small secondary" data-mal3ab-chat title="Chat">💬</button>
  <button class="btn small" id="updBtn" hidden></button>
  <span id="langslot"></span>
</div>

<div class="hero">
  <h1>🎮 <span data-i18n="app"></span></h1>
  <p data-i18n="tagline"></p>
</div>

<div class="join">
  <span data-i18n="haveCode"></span>
  <input id="code" maxlength="4" placeholder="ABCD">
  <button class="btn" onclick="joinRoom()" data-i18n="enterRoom"></button>
</div>
<div class="msg" id="msg"></div>

<h2 class="section" data-i18n="games"></h2>
<div class="grid" id="grid"></div>

<div style="text-align:center;padding:30px">
  <a class="btn secondary" href="history.html" data-i18n="history"></a>
</div>

<!-- friends panel -->
<div class="modal" id="fmodal" hidden>
  <div class="box friends">
    <h3 data-i18n="friends"></h3>
    <div id="fbody"></div>
    <div class="msg" id="fmsg"></div>
    <button class="btn tiny secondary close" onclick="fmodal.hidden=true">✕</button>
  </div>
</div>

<!-- account modal -->
<div class="modal" id="modal" hidden>
  <div class="box">
    <div class="tabs">
      <button class="tab active" onclick="tab('login')" data-i18n="login"></button>
      <button class="tab" onclick="tab('signup')" data-i18n="signup"></button>
    </div>
    <input id="username" class="text" data-i18n-ph="username">
    <input id="email" class="text" type="email" data-i18n-ph="emailOptional" hidden>
    <input id="password" class="text" type="password" data-i18n-ph="password">
    <label class="remember"><input type="checkbox" id="remember"> <span data-i18n="remember"></span></label>
    <button class="btn" id="submit" onclick="submitAuth()"></button>
    <div class="msg" id="amsg"></div>
    <hr>
    <div class="guest"><span data-i18n="orGuest"></span> <input id="guest" class="text" data-i18n-ph="username"> <button class="btn small secondary" onclick="saveGuest()">OK</button></div>
    <button class="btn tiny secondary close" onclick="modal.hidden=true">✕</button>
  </div>
</div>

<script>
const GAMES = [
  { id: 'chess',     icon: '♞',   key: 'chess', room: true, clock: true, bot: true },
  { id: 'pitch-legends/index.html', icon: '⚽', key: 'pitch' },
  { id: 'turf-rush.html',       icon: '🏁', key: 'turfrush', bot: true },
  { id: 'city-hall/index.html', icon: '🏙️', key: 'cityhall' },
  { id: 'voxel/index.html',     icon: '🧱', key: 'voxel' },
  { id: 'voxel-strike/index.html', icon: '🔫', key: 'voxelstrike' },
  { id: 'brick-builder/index.html', icon: '🏗️', key: 'bricks' },
  { id: 'connect4',  icon: '🔴🟡', key: 'connect4', room: true, bot: true },
  { id: 'tictactoe', icon: '❌⭕', key: 'tictactoe', room: true, bot: true },
];
const msg = document.getElementById('msg'), modal = document.getElementById('modal');
let mode = 'login';

// ❤️ favourite games are pinned first (saved on this device and on the account, so the apps show them too)
let FAVS = []; try { FAVS = JSON.parse(localStorage.getItem('mal3ab-favs') || '[]'); } catch (e) {}
function toggleFav(key) {
  FAVS = FAVS.includes(key) ? FAVS.filter(k => k !== key) : [key, ...FAVS];
  try { localStorage.setItem('mal3ab-favs', JSON.stringify(FAVS)); } catch (e) {}
  if (Auth.token) Auth.saveGame('hub', 'mal3ab-favs', FAVS).catch(() => {});
  draw();
}
async function loadFavs() {
  if (!Auth.token) return;
  try { const sv = await Auth.loadSaves('hub'); if (Array.isArray(sv['mal3ab-favs'])) { FAVS = sv['mal3ab-favs']; localStorage.setItem('mal3ab-favs', JSON.stringify(FAVS)); draw(); } } catch (e) {}
}
function draw() {
  document.getElementById('langslot').innerHTML = langButton();
  const list = [...GAMES].sort((a, b) => { const fa = FAVS.indexOf(a.key), fb = FAVS.indexOf(b.key); return (fa < 0 ? 99 : fa) - (fb < 0 ? 99 : fb); });
  document.getElementById('grid').innerHTML = list.map(g => `
    <div class="card ${FAVS.includes(g.key) ? 'fav' : ''}">
      <button class="heart" onclick="toggleFav('${g.key}')" title="${t(FAVS.includes(g.key) ? 'unpin' : 'pin')}" aria-label="${t(FAVS.includes(g.key) ? 'unpin' : 'pin')}">${FAVS.includes(g.key) ? '❤️' : '🤍'}</button>
      <div class="icon">${g.icon}</div>
      <h2>${t(g.key)}</h2>
      <p>${t(g.key + 'Desc')}</p>
      ${g.clock ? `<label class="clock">${t('timeControl')}:
        <select id="tc-${g.id}"><option value="0">${t('noClock')}</option><option value="1">1 ${t('min')}</option><option value="2">2 ${t('min')}</option><option value="3">3 ${t('min')}</option><option value="5">5 ${t('min')}</option><option value="10" selected>10 ${t('min')}</option><option value="15">15 ${t('min')}</option><option value="20">20 ${t('min')}</option><option value="30">30 ${t('min')}</option><option value="45">45 ${t('min')}</option><option value="60">60 ${t('min')}</option><option value="90">90 ${t('min')}</option></select> + <select id="inc-${g.id}" title="${t('increment')}"><option value="0">0 ${t('sec')}</option><option value="1">1 ${t('sec')}</option><option value="2">2 ${t('sec')}</option><option value="3">3 ${t('sec')}</option><option value="5">5 ${t('sec')}</option><option value="10">10 ${t('sec')}</option><option value="15">15 ${t('sec')}</option><option value="20">20 ${t('sec')}</option><option value="30">30 ${t('sec')}</option></select></label>` : ''}
      <div class="actions">
        ${g.room ? `<button class="btn" onclick="createRoom('${g.id}', ${!!g.clock})">🌐 ${t('online')}</button>`
                 : `<a class="btn" href="games/${g.id}">▶ ${t('play')}</a>`}
      </div>
      ${g.bot ? `<div class="actions botrow">
        <select id="lvl-${g.key}" title="${t('vsBot')}"><option value="easy">${t('easy')}</option><option value="medium" selected>${t('medium')}</option><option value="hard">${t('hard')}</option></select>
        <button class="btn secondary" onclick="playBot('${g.id}', '${g.key}', ${!!g.clock})">🤖 ${t('vsBot')}</button></div>` : ''}
    </div>`).join('');
  drawWho();
  applyLang();
}
function drawWho() {
  const w = document.getElementById('who');
  if (Auth.profile) {
    const p = Auth.profile;
    w.innerHTML = `<a class="me" href="account.html" title="${t('myAccount')}">${avatarHtml(p, 28)} <b>${p.username}</b></a> · ${p.wins} ${t('wins')} · ${p.losses} ${t('losses')} · ${p.draws} ${t('draws')}
      ${p.is_admin ? `<a class="btn tiny" href="admin.html">${t('admin')}</a>` : ''}
      <button class="btn tiny secondary" onclick="Auth.signOut()">${t('logout')}</button>`;
  } else {
    const g = Auth.name();
    w.innerHTML = `${g ? '👤 ' + g + ' (' + t('guest') + ')' : ''} <button class="btn small" onclick="openModal()">${t('login')} / ${t('signup')}</button>`;
  }
}
function openModal() { modal.hidden = false; tab('login'); document.getElementById('guest').value = Auth.name(); }
function tab(m) {
  mode = m;
  document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', (i === 0) === (m === 'login')));
  document.getElementById('email').hidden = m !== 'signup';
  document.getElementById('username').placeholder = t(m === 'signup' ? 'username' : 'usernameOrEmail');
  document.getElementById('submit').textContent = t(m);
  document.getElementById('amsg').textContent = '';
}
async function submitAuth() {
  const email = document.getElementById('email').value.trim(), pw = document.getElementById('password').value, un = document.getElementById('username').value.trim();
  const am = document.getElementById('amsg');
  try {
    const rem = document.getElementById('remember').checked;
    if (mode === 'signup') await Auth.signUp(un, pw, email, rem);
    else await Auth.signIn(un, pw, rem);
    modal.hidden = true;
  } catch (e) { am.textContent = e.message; }
}
function saveGuest() { Auth.setGuestName(document.getElementById('guest').value.trim()); modal.hidden = true; drawWho(); }

async function ensureName() {
  if (Auth.name()) return true;
  const n = prompt(t('username'));
  if (!n) return false;
  Auth.setGuestName(n.trim()); drawWho();
  return true;
}
const clockMin = () => { const e = document.getElementById('tc-chess'); return e ? e.value : 10; };
const clockInc = () => { const e = document.getElementById('inc-chess'); return e ? e.value : 0; };
function playBot(id, key, clock) {
  const lvl = document.getElementById('lvl-' + key).value;
  if (id.endsWith('.html')) { location.href = `games/${id}?bot=${lvl}`; return; }
  location.href = `games/${id}.html?bot=${lvl}${clock ? '&tc=' + clockMin() + '&inc=' + clockInc() : ''}`;
}
async function createRoom(game, clock) {
  if (!await ensureName()) return;
  msg.textContent = t('creating');
  try {
    const tc = clock ? document.getElementById('tc-' + game).value : '';
    const code = await Net.create(game, {});
    location.href = `games/${game}.html?code=${code}&p=1${tc ? '&tc=' + tc + '&inc=' + clockInc() : ''}`;
  } catch (e) { msg.textContent = e.message; }
}
async function joinRoom(code) {
  code = code || document.getElementById('code').value;
  if (code.length < 4) { msg.textContent = t('codeHint'); return; }
  if (!await ensureName()) return;
  msg.textContent = t('joining');
  try {
    const room = await Net.join(code);
    location.href = `games/${room.game}.html?code=${room.code}&p=2`;
  } catch (e) { msg.textContent = e.message; }
}
// ---------- friends + fast connect ----------
const fmodal = document.getElementById('fmodal');
const FAST = ['chess', 'pitch', 'connect4', 'tictactoe', 'turfrush', 'voxel', 'voxelstrike', 'bricks'];
let fTimer = null, waiting = null;
function openFriends() { fmodal.hidden = false; drawFriends(); clearInterval(fTimer); fTimer = setInterval(() => { if (!fmodal.hidden && !waiting) drawFriends(); else if (fmodal.hidden) clearInterval(fTimer); }, 10000); }
async function drawFriends() {
  const b = document.getElementById('fbody'), m = document.getElementById('fmsg');
  if (!Auth.user) { b.innerHTML = `<p class="hint">${t('loginForFriends')}</p><button class="btn" onclick="fmodal.hidden=true;openModal()">${t('login')}</button>`; return; }
  if (waiting) { b.innerHTML = `<p class="waiting">${t('waitingFor', { p: waiting.name })}</p><button class="btn secondary small" onclick="cancelWait()">${t('decline')}</button>`; return; }
  let d; try { d = await Friends.list(); } catch (e) { m.textContent = e.message; return; }
  const opts = FAST.map(g => `<option value="${g}">${t(g)}</option>`).join('');
  b.innerHTML = `
    <div class="frow add"><input id="fname" class="text" placeholder="${t('addFriend')}"><button class="btn small" onclick="addFriend()">${t('send')}</button></div>
    ${d.incoming.length ? `<h4>${t('requests')}</h4>` + d.incoming.map(r => `<div class="frow"><span>👤 ${r.username}</span>
        <button class="btn tiny" onclick="respondFriend(${r.req_id}, true)">✅ ${t('accept')}</button><button class="btn tiny secondary" onclick="respondFriend(${r.req_id}, false)">✖</button></div>`).join('') : ''}
    ${d.outgoing.map(r => `<div class="frow muted"><span>👤 ${r.username} · ${t('sent')}…</span><button class="btn tiny secondary" onclick="respondFriend(${r.req_id}, false)">✖</button></div>`).join('')}
    ${d.friends.length ? d.friends.map(f => `<div class="frow"><span><i class="fdot ${f.online ? 'on' : ''}"></i> ${f.username} <small>${f.online ? t('isOnline') : t('isOffline')}</small></span>
        ${f.online ? `<select id="g-${f.id}">${opts}</select><button class="btn tiny" onclick="fastConnect('${f.id}', '${f.username.replace(/'/g, '')}')">${t('fastConnect')}</button>` : ''}
        <button class="btn tiny secondary" title="${t('remove')}" onclick="removeFriend('${f.id}')">🗑</button></div>`).join('') : `<p class="hint">${t('noFriends')}</p>`}`;
}
async function addFriend() { const m = document.getElementById('fmsg'); try { await Friends.request(document.getElementById('fname').value); m.textContent = t('sent') + ' ✅'; drawFriends(); } catch (e) { m.textContent = e.message; } }
async function respondFriend(id, ok) { try { await Friends.respond(id, ok); } catch (e) {} drawFriends(); }
async function removeFriend(id) { try { await Friends.remove(id); } catch (e) {} drawFriends(); }
const randTurf = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
async function voxelData() {
  const saves = await Auth.loadSaves('voxel');
  const parse = (v) => typeof v === 'string' ? JSON.parse(v) : v;
  let worlds = saves['voxel-worlds'], profile = saves['voxel-profile'];
  try { if (!worlds) worlds = JSON.parse(localStorage.getItem('voxel-worlds') || 'null'); if (!profile) profile = JSON.parse(localStorage.getItem('voxel-profile') || 'null'); } catch (e) {}
  return { worlds: parse(worlds) || [], code: profile && parse(profile).code };
}
async function fastConnect(id, name) {
  const game = document.getElementById('g-' + id).value, m = document.getElementById('fmsg');
  try {
    let voxel = null;
    if (game === 'voxel') {
      const vd = await voxelData();
      if (!vd.code || !vd.worlds.length) { m.textContent = t('voxelFirst'); return; }
      const b = document.getElementById('fbody');
      const chosen = await new Promise(res => {
        b.innerHTML = `<h4>${t('pickWorld')}</h4>` + vd.worlds.map(w => `<div class="frow"><span>🧱 ${w.name} <small>${w.mode || ''}</small></span><button class="btn tiny" data-w="${w.id}">${t('fastConnect')}</button></div>`).join('') +
          `<button class="btn secondary small" id="w-cancel">${t('decline')}</button>`;
        b.querySelectorAll('button[data-w]').forEach(x => x.onclick = () => res(x.dataset.w));
        b.querySelector('#w-cancel').onclick = () => res(null);
      });
      if (!chosen) { drawFriends(); return; }
      voxel = { world: chosen, myCode: vd.code, friendCode: await Friends.voxelCodeOf(id) };
    }
    const code = game === 'turfrush' ? randTurf() : game === 'pitch' ? randTurf() + 'P' : game === 'voxelstrike' ? randTurf() + 'S' : game === 'bricks' ? randTurf() + 'B' : game === 'voxel' ? voxel.myCode : await Net.create(game, {});
    const invId = await Friends.invite(id, game, code);
    waiting = { id: invId, name, game, code }; drawFriends();
    const poll = setInterval(async () => {
      if (!waiting) { clearInterval(poll); return; }
      const st = await Friends.inviteStatus(waiting.id);
      if (st === 'accepted') {
        clearInterval(poll);
        if (game === 'pitch') location.href = `games/pitch-legends/index.html?pvp=${code}&role=host`;
        else if (game === 'voxel') location.href = `games/voxel/index.html?world=${encodeURIComponent(voxel.world)}&friend=${encodeURIComponent(voxel.friendCode || '')}&fname=${encodeURIComponent(name)}`;
        else location.href = Invites.gameUrl(game, code, 1) + (game === 'chess' ? '&tc=' + clockMin() + '&inc=' + clockInc() : '');
      }
      else if (st === 'declined') { clearInterval(poll); m.textContent = t('declined', { p: name }); waiting = null; drawFriends(); }
    }, 2500);
  } catch (e) { m.textContent = e.message; }
}
function cancelWait() { waiting = null; drawFriends(); }

document.getElementById('code').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
document.addEventListener('langchange', draw);
document.addEventListener('authchange', () => { drawWho(); loadFavs(); });

(async () => {
  await Auth.init();
  draw(); loadFavs();
  const join = new URLSearchParams(location.search).get('join');
  if (join) { document.getElementById('code').value = join.toUpperCase(); joinRoom(join); }
})();
</script>
<script>
// apps: an Update button (downloads and installs the new app by itself) and the app's own version next to the title
(function () {
  const V = window.Mal3abVersion, b = document.getElementById('updBtn'); if (!V || !b) return;
  const draw = () => {
    document.querySelectorAll('[data-ver]').forEach(e => e.textContent = 'v' + V.current());
    if (!V.app) return;
    b.hidden = false; b.textContent = t('ver_btn'); b.classList.toggle('secondary', !V.outdated() && !V.legacy);
    b.style.boxShadow = V.outdated() || V.legacy ? '0 0 0 3px #ff5d73' : '';
  };
  b.onclick = () => V.blocked();
  V.ready.then(() => { draw(); if (V.outdated()) V.blocked(); });
  document.addEventListener('langchange', draw); draw();
})();
</script>
</body>
</html>
