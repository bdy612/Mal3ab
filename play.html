<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملعب — Mal3ab</title>
<link rel="stylesheet" href="shared/style.css?v=1793401000">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="shared/i18n.js?v=1793401000"></script>
<script src="shared/net.js?v=1793401000"></script>
<script src="shared/games.js?v=1793401000"></script>
</head>
<body>
<div class="topbar">
  <div class="title">🎮 <span data-i18n="app"></span> <span class="ver" data-ver>v1.0</span></div>
  <div class="room" id="who"></div>
  <button class="btn small secondary" onclick="openFriends()" data-i18n="friends"></button>
  <button class="btn small secondary" data-mal3ab-chat title="Chat">💬</button>
  <button class="btn small" id="updBtn" hidden></button>
  <span id="langslot"></span>
</div>

<div class="hero">
  <h1>🎮 <span data-i18n="app"></span></h1>
  <p data-i18n="tagline"></p>
</div>

<div class="join">
  <span data-i18n="haveCode"></span>
  <input id="code" maxlength="4" placeholder="ABCD">
  <button class="btn" onclick="joinRoom()" data-i18n="enterRoom"></button>
</div>
<div class="msg" id="msg"></div>

<div id="grid"></div>

<div style="text-align:center;padding:30px">
  <a class="btn secondary" href="history.html" data-i18n="history"></a>
</div>

<!-- friends panel -->
<div class="modal" id="fmodal" hidden>
  <div class="box friends">
    <h3 data-i18n="friends"></h3>
    <div id="fbody"></div>
    <div class="msg" id="fmsg"></div>
    <button class="btn tiny secondary close" onclick="fmodal.hidden=true">✕</button>
  </div>
</div>

<!-- account modal -->
<div class="modal" id="modal" hidden>
  <div class="box">
    <div class="tabs">
      <button class="tab active" onclick="tab('login')" data-i18n="login"></button>
      <button class="tab" onclick="tab('signup')" data-i18n="signup"></button>
    </div>
    <input id="username" class="text" data-i18n-ph="username">
    <input id="email" class="text" type="email" data-i18n-ph="emailOptional" hidden>
    <input id="password" class="text" type="password" data-i18n-ph="password">
    <label class="remember"><input type="checkbox" id="remember"> <span data-i18n="remember"></span></label>
    <button class="btn" id="submit" onclick="submitAuth()"></button>
    <div class="msg" id="amsg"></div>
    <hr>
    <div class="guest"><span data-i18n="orGuest"></span> <input id="guest" class="text" data-i18n-ph="username"> <button class="btn small secondary" onclick="saveGuest()">OK</button></div>
    <button class="btn tiny secondary close" onclick="modal.hidden=true">✕</button>
  </div>
</div>

<script>
const GAMES = window.MAL3AB_GAMES;   // the list lives in shared/games.js (game pages use it too)
const msg = document.getElementById('msg'), modal = document.getElementById('modal');
let mode = 'login';

// ❤️ favourite games are pinned first (saved on this device and on the account, so the apps show them too)
let FAVS = []; try { FAVS = JSON.parse(localStorage.getItem('mal3ab-favs') || '[]'); } catch (e) {}
function toggleFav(key) {
  FAVS = FAVS.includes(key) ? FAVS.filter(k => k !== key) : [key, ...FAVS];
  try { localStorage.setItem('mal3ab-favs', JSON.stringify(FAVS)); } catch (e) {}
  if (Auth.token) Auth.saveGame('hub', 'mal3ab-favs', FAVS).catch(() => {});
  draw();
}
async function loadFavs() {
  if (!Auth.token) return;
  try { const sv = await Auth.loadSaves('hub'); let ch = false;
    if (Array.isArray(sv['mal3ab-favs'])) { FAVS = sv['mal3ab-favs']; localStorage.setItem('mal3ab-favs', JSON.stringify(FAVS)); ch = true; }
    if (sv['mal3ab-hub-layout'] && typeof sv['mal3ab-hub-layout'] === 'object') { LAYOUT = fixLayout(sv['mal3ab-hub-layout']); localStorage.setItem('mal3ab-hub-layout', JSON.stringify(LAYOUT)); ch = true; }
    if (ch) draw(); } catch (e) {}
}
// ---- my own arrangement: the order of the games and my own groups (saved on this device and on the account) ----
addStrings({ hub_arrange: '✏️ رتّب الألعاب', hub_done: '✓ خلصت', hub_newGroup: '➕ جروب جديد', hub_groupName: 'اسم الجروب', hub_dragHere: 'اسحب ألعاب وحطها هنا', hub_delGroup: 'امسح الجروب (الألعاب بترجع مكانها)',
  hub_hint: 'اسحب أي لعبة وحطها في المكان اللي انت عايزه — في المفضلة، أو في جروب من جروباتك، أو رتّبها جوه أي قسم.', hub_myGroup: 'جروب جديد', hub_reset: '↺ رجّع الترتيب الأصلي', hub_resetQ: 'ترجّع كل الترتيب والجروبات زي الأول؟', hub_more: 'صفحة اللعبة: مين بيلعب دلوقتي، أصحابك، وإزاي تلعب' },
  { hub_arrange: '✏️ Arrange Games', hub_done: '✓ Done', hub_newGroup: '➕ New Group', hub_groupName: 'Group name', hub_dragHere: 'Drag games here', hub_delGroup: 'Delete group (its games go back)',
  hub_hint: 'Drag any game to where you want it — into Pinned, into one of your groups, or to a new spot inside any section.', hub_myGroup: 'New group', hub_reset: '↺ Reset To Default', hub_resetQ: 'Put every game and group back the way it was?', hub_more: 'Game page: who is playing now, your friends, how to play' });
const fixLayout = (L) => ({ groups: Array.isArray(L && L.groups) ? L.groups.filter(g => g && g.id).map(g => ({ id: String(g.id), name: String(g.name || '').slice(0, 30), games: Array.isArray(g.games) ? g.games.filter(k => typeof k === 'string') : [] })) : [],
  order: (L && L.order && typeof L.order === 'object') ? L.order : {} });
let LAYOUT = fixLayout((() => { try { return JSON.parse(localStorage.getItem('mal3ab-hub-layout') || 'null'); } catch (e) { return null; } })());
let EDIT = false;
function saveLayout() {
  try { localStorage.setItem('mal3ab-hub-layout', JSON.stringify(LAYOUT)); localStorage.setItem('mal3ab-favs', JSON.stringify(FAVS)); } catch (e) {}
  if (Auth.token) { Auth.saveGame('hub', 'mal3ab-hub-layout', LAYOUT).catch(() => {}); Auth.saveGame('hub', 'mal3ab-favs', FAVS).catch(() => {}); }
}
// where each game is now: 'pinned', a group id, 'games' or 'new'
function sections(live) {
  const inGroup = new Set(LAYOUT.groups.flatMap(g => g.games)), byKey = (k) => live.find(g => g.key === k);
  const sorted = (list, sec) => { const o = LAYOUT.order[sec] || []; return list.slice().sort((a, b) => { const ia = o.indexOf(a.key), ib = o.indexOf(b.key); return (ia < 0 ? 1e6 + list.indexOf(a) : ia) - (ib < 0 ? 1e6 + list.indexOf(b) : ib); }); };
  const pinned = FAVS.map(byKey).filter(Boolean), rest = live.filter(g => !FAVS.includes(g.key) && !inGroup.has(g.key));
  return [{ id: 'pinned', title: t('pinnedGames'), list: pinned }]
    .concat(LAYOUT.groups.map(g => ({ id: g.id, title: g.name || t('hub_myGroup'), list: g.games.map(byKey).filter(Boolean).filter(x => !FAVS.includes(x.key)), custom: true })))
    .concat([{ id: 'games', title: t('games'), list: sorted(rest.filter(g => !g.isNew), 'games') }, { id: 'new', title: t('newGames'), list: sorted(rest.filter(g => g.isNew), 'new') }]);
}
// move a game into a section, before another game (or at the end)
function moveGame(key, to, before) {
  FAVS = FAVS.filter(k => k !== key); for (const g of LAYOUT.groups) g.games = g.games.filter(k => k !== key);
  const live = GAMES.filter(g => !g.isNew || READY.includes(g.key)), game = live.find(g => g.key === key); if (!game) return;
  if ((to === 'games' && game.isNew) || (to === 'new' && !game.isNew)) to = game.isNew ? 'new' : 'games';   // the two built-in lists keep their own games
  const insert = (arr) => { const i = before ? arr.indexOf(before) : -1; if (i < 0) arr.push(key); else arr.splice(i, 0, key); return arr; };
  if (to === 'pinned') FAVS = insert(FAVS);
  else { const g = LAYOUT.groups.find(x => x.id === to);
    if (g) g.games = insert(g.games);
    else { const cur = sections(live).find(x => x.id === to).list.map(x => x.key).filter(k => k !== key); LAYOUT.order[to] = insert(cur); } }
  saveLayout(); draw();
}
function newGroup() { const n = prompt(t('hub_groupName'), t('hub_myGroup')); if (n == null) return; LAYOUT.groups.push({ id: 'g' + Date.now().toString(36), name: (n.trim() || t('hub_myGroup')).slice(0, 30), games: [] }); saveLayout(); draw(); }
function renameGroup(id, v) { const g = LAYOUT.groups.find(x => x.id === id); if (!g) return; g.name = String(v || '').trim().slice(0, 30) || t('hub_myGroup'); saveLayout(); }
function delGroup(id) { LAYOUT.groups = LAYOUT.groups.filter(x => x.id !== id); saveLayout(); draw(); }
function resetLayout() { if (!confirm(t('hub_resetQ'))) return; LAYOUT = { groups: [], order: {} }; FAVS = []; saveLayout(); draw(); }
function setEdit(on) { EDIT = on; draw(); }
// drag & drop with the mouse or a finger
let DRAG = null;
document.addEventListener('pointerdown', (e) => {
  if (!EDIT) return; const c = e.target.closest('.card[data-key]'); if (!c || e.target.closest('input,button:not(.grip)')) return;
  e.preventDefault(); const r = c.getBoundingClientRect();
  DRAG = { key: c.dataset.key, el: c, sx: e.clientX, sy: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, started: false, ghost: null, id: e.pointerId };
});
document.addEventListener('pointermove', (e) => {
  if (!DRAG) return;
  if (!DRAG.started) { if (Math.hypot(e.clientX - DRAG.sx, e.clientY - DRAG.sy) < 6) return; DRAG.started = true;
    const g = DRAG.ghost = DRAG.el.cloneNode(true); g.classList.add('dragghost'); g.style.width = DRAG.el.offsetWidth + 'px'; document.body.appendChild(g); DRAG.el.classList.add('dragging'); }
  DRAG.ghost.style.left = (e.clientX - DRAG.dx) + 'px'; DRAG.ghost.style.top = (e.clientY - DRAG.dy) + 'px';
  document.querySelectorAll('.dropbefore,.dropin').forEach(x => x.classList.remove('dropbefore', 'dropin'));
  DRAG.ghost.style.display = 'none'; const under = document.elementFromPoint(e.clientX, e.clientY); DRAG.ghost.style.display = '';
  const card = under && under.closest('.card[data-key]'), grid = under && under.closest('[data-sec]');
  DRAG.target = grid ? { sec: grid.dataset.sec, before: card && card.dataset.key !== DRAG.key ? card.dataset.key : null } : null;
  if (card && card.dataset.key !== DRAG.key) card.classList.add('dropbefore'); else if (grid) grid.classList.add('dropin');
  if (e.clientY < 60) scrollBy(0, -12); else if (e.clientY > innerHeight - 60) scrollBy(0, 12);
});
const endDrag = () => { if (!DRAG) return; const D = DRAG; DRAG = null; if (D.ghost) D.ghost.remove(); D.el.classList.remove('dragging');
  document.querySelectorAll('.dropbefore,.dropin').forEach(x => x.classList.remove('dropbefore', 'dropin'));
  if (D.started && D.target) moveGame(D.key, D.target.sec, D.target.before); };
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
(function () { const st = document.createElement('style'); st.textContent = `
  .arrangebar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 14px 0 0; }
  .arrangebar .hint { color: var(--muted); font-size: 13px; flex-basis: 100%; text-align: center; }
  .grid.editing { outline: 2px dashed rgba(255,255,255,.12); outline-offset: 6px; border-radius: 16px; min-height: 90px; }
  .card .cinfo { color: inherit; text-decoration: none; display: flex; flex-direction: column; gap: 10px; flex: 1; } .card .cinfo:hover h2 { text-decoration: underline; }
  .grid.editing .card .cinfo { pointer-events: none; }
  .grid.editing .card { cursor: grab; user-select: none; touch-action: none; position: relative; } .grid.editing .card a.btn { pointer-events: none; opacity: .6; }
  .card .grip { position: absolute; top: 8px; inset-inline-start: 8px; color: var(--muted); font-size: 18px; }
  .card.dragging { opacity: .3; } .card.dropbefore { box-shadow: -4px 0 0 0 #ffb703; } .ar .card.dropbefore { box-shadow: 4px 0 0 0 #ffb703; }
  .grid.dropin { outline-color: #ffb703; }
  .dragghost { position: fixed; z-index: 9999; pointer-events: none; transform: rotate(2deg) scale(1.03); box-shadow: 0 18px 40px rgba(0,0,0,.5); opacity: .95; }
  .dropempty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 26px; border: 2px dashed rgba(255,255,255,.15); border-radius: 14px; }
  .grouphead { display: flex; gap: 8px; justify-content: center; align-items: center; } .grouphead input { max-width: 260px; text-align: center; font-weight: 700; }`;
  document.head.appendChild(st); })();
const READY = window.MAL3AB_READY;
// one card per game: title with the emoji on the other side, a description, and a single Play button
// (online / vs bot / clock are chosen inside each game)
function card(g) {
  const fav = FAVS.includes(g.key);
  return `<div class="card ${fav ? 'fav' : ''}" data-key="${g.key}">${EDIT ? '<span class="grip" aria-hidden="true">⠿</span>' : ''}
      <a class="cinfo" href="game.html?g=${g.key}" title="${t('hub_more')}"><div class="ctop"><h2>${t(g.key)}</h2><span class="icon">${g.icon}</span></div>
      <p>${t(g.key + 'Desc')}</p></a>
      <div class="actions"><a class="btn" href="${g.href}">▶ ${t('play')}</a>
        <button class="heart" onclick="toggleFav('${g.key}')" title="${t(fav ? 'unpin' : 'pin')}" aria-label="${t(fav ? 'unpin' : 'pin')}">${fav ? '❤️' : '🤍'}</button></div>
    </div>`;
}
function draw() {
  document.getElementById('langslot').innerHTML = langButton();
  const live = GAMES.filter(g => !g.isNew || READY.includes(g.key));
  const esc = (v) => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const head = (S) => EDIT && S.custom ? `<div class="section grouphead"><input class="text" value="${esc(S.title)}" maxlength="30" onchange="renameGroup('${S.id}', this.value)" aria-label="${t('hub_groupName')}"><button class="btn tiny secondary" onclick="delGroup('${S.id}')" title="${t('hub_delGroup')}">🗑</button></div>`
    : `<h2 class="section">${esc(S.title)}</h2>`;
  const section = (S) => (S.list.length || (EDIT && (S.custom || S.id === 'pinned'))) ? head(S) + `<div class="grid ${EDIT ? 'editing' : ''}" data-sec="${S.id}">${S.list.map(card).join('')}${EDIT && !S.list.length ? `<div class="dropempty">${t('hub_dragHere')}</div>` : ''}</div>` : '';
  const bar = `<div class="arrangebar">${EDIT ? `<span class="hint">${t('hub_hint')}</span><button class="btn small secondary" onclick="newGroup()">${t('hub_newGroup')}</button><button class="btn small secondary" onclick="resetLayout()">${t('hub_reset')}</button><button class="btn small" onclick="setEdit(false)">${t('hub_done')}</button>` : `<button class="btn small secondary" onclick="setEdit(true)">${t('hub_arrange')}</button>`}</div>`;
  document.getElementById('grid').innerHTML = bar + sections(live).map(section).join('');
  drawWho();
  applyLang();
}
function drawWho() {
  const w = document.getElementById('who');
  if (Auth.profile) {
    const p = Auth.profile;
    w.innerHTML = `<a class="me" href="account.html" title="${t('myAccount')}">${avatarHtml(p, 28)} <b>${p.username}</b></a> · ${p.wins} ${t('wins')} · ${p.losses} ${t('losses')} · ${p.draws} ${t('draws')}
      ${p.is_admin ? `<a class="btn tiny" href="admin.html">${t('admin')}</a>` : ''}
      <button class="btn tiny secondary" onclick="Auth.signOut()">${t('logout')}</button>`;
  } else {
    const g = Auth.name();
    w.innerHTML = `${g ? '👤 ' + g + ' (' + t('guest') + ')' : ''} <button class="btn small" onclick="openModal()">${t('login')} / ${t('signup')}</button>`;
  }
}
function openModal() { modal.hidden = false; tab('login'); document.getElementById('guest').value = Auth.name(); }
function tab(m) {
  mode = m;
  document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', (i === 0) === (m === 'login')));
  document.getElementById('email').hidden = m !== 'signup';
  document.getElementById('username').placeholder = t(m === 'signup' ? 'username' : 'usernameOrEmail');
  document.getElementById('submit').textContent = t(m);
  document.getElementById('amsg').textContent = '';
}
async function submitAuth() {
  const email = document.getElementById('email').value.trim(), pw = document.getElementById('password').value, un = document.getElementById('username').value.trim();
  const am = document.getElementById('amsg');
  try {
    const rem = document.getElementById('remember').checked;
    if (mode === 'signup') await Auth.signUp(un, pw, email, rem);
    else await Auth.signIn(un, pw, rem);
    modal.hidden = true;
  } catch (e) { am.textContent = e.message; }
}
function saveGuest() { Auth.setGuestName(document.getElementById('guest').value.trim()); modal.hidden = true; drawWho(); }

async function ensureName() {
  if (Auth.name()) return true;
  const n = prompt(t('username'));
  if (!n) return false;
  Auth.setGuestName(n.trim()); drawWho();
  return true;
}
const clockMin = () => { const e = document.getElementById('tc-chess'); return e ? e.value : 10; };
const clockInc = () => { const e = document.getElementById('inc-chess'); return e ? e.value : 0; };
function playBot(id, key, clock) {
  const lvl = document.getElementById('lvl-' + key).value;
  if (id.endsWith('.html')) { location.href = `games/${id}?bot=${lvl}`; return; }
  location.href = `games/${id}.html?bot=${lvl}${clock ? '&tc=' + clockMin() + '&inc=' + clockInc() : ''}`;
}
async function createRoom(game, clock) {
  if (!await ensureName()) return;
  msg.textContent = t('creating');
  try {
    const tc = clock ? document.getElementById('tc-' + game).value : '';
    const code = await Net.create(game, {});
    location.href = `games/${game}.html?code=${code}&p=1${tc ? '&tc=' + tc + '&inc=' + clockInc() : ''}`;
  } catch (e) { msg.textContent = e.message; }
}
async function joinRoom(code) {
  code = code || document.getElementById('code').value;
  if (code.length < 4) { msg.textContent = t('codeHint'); return; }
  if (!await ensureName()) return;
  msg.textContent = t('joining');
  try {
    const room = await Net.join(code);
    location.href = `games/${room.game}.html?code=${room.code}&p=2`;
  } catch (e) { msg.textContent = e.message; }
}
// ---------- friends + fast connect ----------
const fmodal = document.getElementById('fmodal');
const FAST = ['chess', 'pitch', 'connect4', 'tictactoe', 'turfrush', 'voxel', 'voxelstrike', 'bricks'];
let fTimer = null, waiting = null;
function openFriends() { fmodal.hidden = false; drawFriends(); clearInterval(fTimer); fTimer = setInterval(() => { if (!fmodal.hidden && !waiting) drawFriends(); else if (fmodal.hidden) clearInterval(fTimer); }, 10000); }
async function drawFriends() {
  const b = document.getElementById('fbody'), m = document.getElementById('fmsg');
  if (!Auth.user) { b.innerHTML = `<p class="hint">${t('loginForFriends')}</p><button class="btn" onclick="fmodal.hidden=true;openModal()">${t('login')}</button>`; return; }
  if (waiting) { b.innerHTML = `<p class="waiting">${t('waitingFor', { p: waiting.name })}</p><button class="btn secondary small" onclick="cancelWait()">${t('decline')}</button>`; return; }
  let d; try { d = await Friends.list(); } catch (e) { m.textContent = e.message; return; }
  const opts = FAST.map(g => `<option value="${g}">${t(g)}</option>`).join('');
  b.innerHTML = `
    <div class="frow add"><input id="fname" class="text" placeholder="${t('addFriend')}"><button class="btn small" onclick="addFriend()">${t('send')}</button></div>
    ${d.incoming.length ? `<h4>${t('requests')}</h4>` + d.incoming.map(r => `<div class="frow"><span>👤 ${r.username}</span>
        <button class="btn tiny" onclick="respondFriend(${r.req_id}, true)">✅ ${t('accept')}</button><button class="btn tiny secondary" onclick="respondFriend(${r.req_id}, false)">✖</button></div>`).join('') : ''}
    ${d.outgoing.map(r => `<div class="frow muted"><span>👤 ${r.username} · ${t('sent')}…</span><button class="btn tiny secondary" onclick="respondFriend(${r.req_id}, false)">✖</button></div>`).join('')}
    ${d.friends.length ? d.friends.map(f => `<div class="frow"><span><i class="fdot ${f.online ? 'on' : ''}"></i> ${f.username} <small>${f.online ? t('isOnline') : t('isOffline')}</small></span>
        ${f.online ? `<select id="g-${f.id}">${opts}</select><button class="btn tiny" onclick="fastConnect('${f.id}', '${f.username.replace(/'/g, '')}')">${t('fastConnect')}</button>` : ''}
        <button class="btn tiny secondary" title="${t('remove')}" onclick="removeFriend('${f.id}')">🗑</button></div>`).join('') : `<p class="hint">${t('noFriends')}</p>`}`;
}
async function addFriend() { const m = document.getElementById('fmsg'); try { await Friends.request(document.getElementById('fname').value); m.textContent = t('sent') + ' ✅'; drawFriends(); } catch (e) { m.textContent = e.message; } }
async function respondFriend(id, ok) { try { await Friends.respond(id, ok); } catch (e) {} drawFriends(); }
async function removeFriend(id) { try { await Friends.remove(id); } catch (e) {} drawFriends(); }
const randTurf = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
async function voxelData() {
  const saves = await Auth.loadSaves('voxel');
  const parse = (v) => typeof v === 'string' ? JSON.parse(v) : v;
  let worlds = saves['voxel-worlds'], profile = saves['voxel-profile'];
  try { if (!worlds) worlds = JSON.parse(localStorage.getItem('voxel-worlds') || 'null'); if (!profile) profile = JSON.parse(localStorage.getItem('voxel-profile') || 'null'); } catch (e) {}
  return { worlds: parse(worlds) || [], code: profile && parse(profile).code };
}
async function fastConnect(id, name) {
  const game = document.getElementById('g-' + id).value, m = document.getElementById('fmsg');
  try {
    let voxel = null;
    if (game === 'voxel') {
      const vd = await voxelData();
      if (!vd.code || !vd.worlds.length) { m.textContent = t('voxelFirst'); return; }
      const b = document.getElementById('fbody');
      const chosen = await new Promise(res => {
        b.innerHTML = `<h4>${t('pickWorld')}</h4>` + vd.worlds.map(w => `<div class="frow"><span>🧱 ${w.name} <small>${w.mode || ''}</small></span><button class="btn tiny" data-w="${w.id}">${t('fastConnect')}</button></div>`).join('') +
          `<button class="btn secondary small" id="w-cancel">${t('decline')}</button>`;
        b.querySelectorAll('button[data-w]').forEach(x => x.onclick = () => res(x.dataset.w));
        b.querySelector('#w-cancel').onclick = () => res(null);
      });
      if (!chosen) { drawFriends(); return; }
      voxel = { world: chosen, myCode: vd.code, friendCode: await Friends.voxelCodeOf(id) };
    }
    const code = game === 'turfrush' ? randTurf() : game === 'pitch' ? randTurf() + 'P' : game === 'voxelstrike' ? randTurf() + 'S' : game === 'bricks' ? randTurf() + 'B' : game === 'voxel' ? voxel.myCode : await Net.create(game, {});
    const invId = await Friends.invite(id, game, code);
    waiting = { id: invId, name, game, code }; drawFriends();
    const poll = setInterval(async () => {
      if (!waiting) { clearInterval(poll); return; }
      const st = await Friends.inviteStatus(waiting.id);
      if (st === 'accepted') {
        clearInterval(poll);
        if (game === 'pitch') location.href = `games/pitch-legends/index.html?pvp=${code}&role=host`;
        else if (game === 'voxel') location.href = `games/voxel/index.html?world=${encodeURIComponent(voxel.world)}&friend=${encodeURIComponent(voxel.friendCode || '')}&fname=${encodeURIComponent(name)}`;
        else location.href = Invites.gameUrl(game, code, 1) + (game === 'chess' ? '&tc=' + clockMin() + '&inc=' + clockInc() : '');
      }
      else if (st === 'declined') { clearInterval(poll); m.textContent = t('declined', { p: name }); waiting = null; drawFriends(); }
    }, 2500);
  } catch (e) { m.textContent = e.message; }
}
function cancelWait() { waiting = null; drawFriends(); }

document.getElementById('code').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
document.addEventListener('langchange', draw);
document.addEventListener('authchange', () => { drawWho(); loadFavs(); });

(async () => {
  await Auth.init();
  draw(); loadFavs();
  const join = new URLSearchParams(location.search).get('join');
  if (join) { document.getElementById('code').value = join.toUpperCase(); joinRoom(join); }
})();
</script>
<script>
// apps: an Update button (downloads and installs the new app by itself) and the app's own version next to the title
(function () {
  const V = window.Mal3abVersion, b = document.getElementById('updBtn'); if (!V || !b) return;
  const draw = () => {
    document.querySelectorAll('[data-ver]').forEach(e => e.textContent = 'v' + V.current());
    if (!V.app) return;
    b.hidden = false; b.textContent = t('ver_btn'); b.classList.toggle('secondary', !V.outdated() && !V.legacy);
    b.style.boxShadow = V.outdated() || V.legacy ? '0 0 0 3px #ff5d73' : '';
  };
  b.onclick = () => V.blocked();
  V.ready.then(() => { draw(); if (V.outdated()) V.blocked(); });
  document.addEventListener('langchange', draw); draw();
})();
</script>
