<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call — Mal3ab</title>
<link rel="icon" href="icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<style>
  :root { --bg: #0b0e1a; --card: #161b2e; --card2: #232a48; --text: #eef0ff; --muted: #9aa3c7; --accent: #ffb703; --red: #ff4d5e; --green: #3ddc84; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Arial, sans-serif; overflow: hidden; }
  [hidden] { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  .btn { background: var(--accent); color: #1a1200; border: 0; border-radius: 12px; padding: 11px 18px; font-size: 16px; font-weight: 700; }
  .btn.sec { background: var(--card2); color: var(--text); }
  input.text { font: inherit; background: var(--card2); color: var(--text); border: 2px solid transparent; border-radius: 10px; padding: 10px 12px; width: 100%; }

  /* lobby */
  #lobby { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto;
    background: radial-gradient(ellipse at 50% -10%, #2a3366 0%, var(--bg) 60%); }
  .lbox { width: min(560px, 100%); background: var(--card); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .lbox h1 { margin: 0; font-size: 24px; color: var(--accent); display: flex; align-items: center; gap: 10px; }
  .lbox h1 small { margin-inline-start: auto; font-size: 13px; color: var(--muted); font-weight: 400; }
  .preview { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .preview .av { position: absolute; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .row .grow { flex: 1; }
  .devs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .devs label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .devs select { font: inherit; font-size: 13px; background: var(--card2); color: var(--text); border: 0; border-radius: 10px; padding: 8px; max-width: 100%; }
  .badge { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: var(--accent); color: #1a1200; flex: none; } .badge.co { background: #8ea0ff; }
  .person .acts { display: flex; gap: 4px; } .person .acts button { background: #0f1220; color: var(--text); border: 0; border-radius: 7px; padding: 4px 7px; font-size: 13px; }
  .person .acts button:hover { background: #3a2030; }
  .dupbox { display: flex; flex-direction: column; gap: 8px; background: #2a1520; border: 1px solid var(--red); border-radius: 12px; padding: 10px; }
  .note { color: var(--muted); font-size: 13px; line-height: 1.5; } .err { color: var(--red); font-size: 13px; min-height: 16px; }

  /* call */
  #call { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(22, 27, 46, .92); }
  .bar b { color: var(--accent); } .bar .sp { flex: 1; } .bar .muted { color: var(--muted); font-size: 13px; }
  .pill { background: var(--card2); color: var(--text); border: 0; border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
  #main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px; min-width: 0; }
  #spot { flex: 3; min-height: 0; display: flex; } #spot:empty { display: none; }
  #grid { flex: 1; min-height: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); grid-auto-rows: minmax(0, 1fr); }
  #spot:not(:empty) + #grid { flex: 0 0 150px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); overflow-x: auto; }
  .tile { position: relative; background: #11152a; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 120px; outline: 3px solid transparent; transition: outline-color .15s; }
  #spot .tile { flex: 1; }
  .tile.speaking { outline-color: var(--green); }
  .tile video { width: 100%; height: 100%; object-fit: cover; background: #000; }
  .tile.screen video, #spot .tile video { object-fit: contain; }
  .tile.me:not(.screen) video { transform: scaleX(-1); }
  .tile .av { width: 84px; height: 84px; border-radius: 50%; background: var(--card2); color: var(--accent); font-size: 38px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .tile .tag { position: absolute; left: 8px; bottom: 8px; background: rgba(0, 0, 0, .6); padding: 4px 9px; border-radius: 8px; font-size: 13px; display: flex; gap: 6px; align-items: center; max-width: calc(100% - 16px); }
  .tile .tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .big { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, .5); color: #fff; border: 0; border-radius: 8px; padding: 4px 8px; font-size: 14px; opacity: 0; transition: opacity .15s; }
  .tile:hover .big { opacity: 1; }
  .tile .conn { position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, .55); border-radius: 8px; padding: 3px 8px; font-size: 12px; color: var(--muted); }
  #side { width: 300px; background: var(--card); display: flex; flex-direction: column; border-inline-start: 1px solid #262d4a; }
  #side h3 { margin: 0; padding: 12px 14px; font-size: 16px; display: flex; align-items: center; } #side h3 button { margin-inline-start: auto; }
  #people, #msgs { flex: 1; overflow: auto; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .person { display: flex; align-items: center; gap: 8px; background: var(--card2); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  .person span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m { background: var(--card2); border-radius: 12px; padding: 7px 10px; font-size: 14px; unicode-bidi: plaintext; text-align: start; word-break: break-word; }
  .m b { color: var(--accent); font-size: 12px; display: block; } .m.me { background: #3a3110; }
  #chatform { display: flex; gap: 6px; padding: 10px; } #chatform input { flex: 1; unicode-bidi: plaintext; }
  .controls { display: flex; justify-content: center; gap: 10px; padding: 12px; background: rgba(22, 27, 46, .92); flex-wrap: wrap; }
  .cb { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--card2); color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; position: relative; }
  .cb.off { background: #4a2030; } .cb.on { background: #1f5f3d; } .cb.hang { background: var(--red); width: 70px; border-radius: 28px; }
  .cb small { position: absolute; bottom: -18px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .controls { padding-bottom: 26px; }
  .toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); background: rgba(22, 27, 46, .96); border: 2px solid var(--accent); border-radius: 12px; padding: 8px 16px; z-index: 50; font-weight: 600; }
  .ar .lbox, .ar #side, .ar .bar { direction: rtl; }
  @media (max-width: 760px) {
    #side { position: fixed; inset: 56px 0 96px 0; width: auto; z-index: 20; }
    .cb { width: 48px; height: 48px; font-size: 20px; } .cb.hang { width: 62px; }
    #grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  }
</style>
</head>
<body>
<!-- before joining: check camera and mic -->
<div id="lobby">
  <div class="lbox">
    <h1>📞 <span id="lTitle"></span><small id="lRoom"></small></h1>
    <div class="preview"><video id="pv" autoplay playsinline muted></video><div class="av" id="pvAv" hidden></div></div>
    <div class="row">
      <button class="pill" id="lMic"></button><button class="pill" id="lCam"></button>
    </div>
    <div class="devs" id="lDevs"></div>
    <input class="text" id="lName" maxlength="24">
    <div class="err" id="lErr"></div>
    <div class="row"><button class="btn grow" id="lJoin"></button><button class="btn sec" id="lHome">🏠</button></div>
    <div class="note" id="lNote"></div>
  </div>
</div>

<!-- in the call -->
<div id="call" hidden>
  <div class="bar"><span>📞 <b data-i18n="app"></b></span><span class="muted" id="cCount"></span><div class="sp"></div>
    <button class="pill" id="cLink"></button><span id="langslot"></span></div>
  <div id="main">
    <div id="stage"><div id="spot"></div><div id="grid"></div></div>
    <div id="side" hidden><h3 id="sideT"></h3><div id="people"></div><div id="setp" class="devs" style="padding:0 12px 12px" hidden></div><div id="msgs" hidden></div>
      <form id="chatform" hidden><input class="text" id="chatIn" maxlength="500" autocomplete="off"><button class="btn" id="chatSend"></button></form></div>
  </div>
  <div class="controls">
    <button class="cb" id="bMic"></button><button class="cb" id="bCam"></button><button class="cb" id="bShare"></button>
    <button class="cb" id="bChat"></button><button class="cb" id="bPeople"></button><button class="cb" id="bSet"></button><button class="cb" id="bFull"></button>
    <button class="cb hang" id="bHang">📞</button>
  </div>
</div>

<script>

}, {

  call_settings: 'Settings', call_micDev: '🎤 Microphone', call_camDev: '📷 Camera', call_spk: '🔊 Speaker', call_default: 'Default', call_noSpk: 'Choosing the speaker is not supported in this browser',
  call_dup: 'You are already in this call from another window or device.', call_moveHere: '↪ Move the call here', call_moved: 'You joined the call from another window', call_host: 'Host', call_cohost: 'Co-host',

  call_banned: 'You were removed from this call and cannot join it again', call_muteAll: '🔇 Mute everyone', call_declined: '{p} declined the call', call_checking: 'Checking…', call_groupOnly: 'This call is only for the group members'
});
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const rid = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
const q = new URLSearchParams(location.search);
let ROOM = (q.get('room') || '').replace(/[^a-z0-9-]/gi, '').slice(0, 24);
if (!ROOM) { ROOM = rid(8); history.replaceState(null, '', location.pathname + '?room=' + ROOM); }
const LINK = location.href.split('?')[0] + '?room=' + ROOM;
const ME = { id: Date.now().toString(36) + rid(6), name: '', at: Date.now() };
// who I am across windows/devices: my account, or a fixed id for this browser when playing as a guest
let UID = ''; try { UID = localStorage.getItem('mal3ab_guest_uid') || ''; if (!UID) { UID = 'guest-' + rid(10); localStorage.setItem('mal3ab_guest_uid', UID); } } catch (e) { UID = 'guest-' + rid(10); }
const RING = (q.get('ring') || '').split(',').filter(x => /^[0-9a-f-]{36}$/.test(x));   // friends being rung: told if I cancel
let ROLES = { host: null, cohosts: [], banned: [] }, answered = false;
const DEV = (() => { try { return JSON.parse(localStorage.getItem('mal3ab-call-devices') || '{}'); } catch (e) { return {}; } })();
const saveDev = () => { try { localStorage.setItem('mal3ab-call-devices', JSON.stringify(DEV)); } catch (e) {} };
const isHost = (uid) => !!uid && uid === ROLES.host, isCo = (uid) => !!uid && (ROLES.cohosts || []).includes(uid);
const canManage = (uid) => isHost(uid) || isCo(uid);
// public STUN + the PeerJS project's public TURN relays (for networks that block direct connections)
const ICE = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
  { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' }] };

const L = { stream: new MediaStream(), audio: null, video: null, screen: null, mic: true, cam: true };
const peers = new Map();       // id -> { pc, name, stream, st, polite, makingOffer, ignoreOffer, tile }
let ch = null, inCall = false, AC = null, spotlight = null, sidePanel = null;

function toast(text) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function initials(n) { return (String(n || '?').trim()[0] || '?').toUpperCase(); }

// ---------------- lobby ----------------
async function getMedia(kind) {
  const a = { echoCancellation: true, noiseSuppression: true }, v = { width: { ideal: 1280 }, height: { ideal: 720 } };
  if (DEV.mic) a.deviceId = { ideal: DEV.mic }; if (DEV.cam) v.deviceId = { ideal: DEV.cam };
  try { return await navigator.mediaDevices.getUserMedia(kind === 'audio' ? { audio: a } : { video: v }); }
  catch (e) { return { error: e }; }
}
async function setupDevices() {
  $('lErr').textContent = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('lErr').textContent = t('call_noDev'); L.mic = L.cam = false; drawLobby(); return; }
  const a = await getMedia('audio'), v = await getMedia('video');
  if (a.getAudioTracks) { L.audio = a.getAudioTracks()[0]; L.stream.addTrack(L.audio); } else L.mic = false;
  if (v.getVideoTracks) { L.video = v.getVideoTracks()[0]; L.stream.addTrack(L.video); } else L.cam = false;
  const denied = [a, v].some(r => r.error && /NotAllowed|Security/i.test(r.error.name));
  if (!L.audio && !L.video) $('lErr').textContent = denied ? t('call_denied') : t('call_noDev');
  else if (denied) $('lErr').textContent = t('call_denied');
  drawLobby(); drawDevices($('lDevs'));
}
// ---- choosing the microphone, camera and speaker ----
async function drawDevices(box) {
  if (!box || !navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  let list = []; try { list = await navigator.mediaDevices.enumerateDevices(); } catch (e) {}
  const cur = { audioinput: L.audio && L.audio.getSettings ? L.audio.getSettings().deviceId : DEV.mic, videoinput: L.video && L.video.getSettings ? L.video.getSettings().deviceId : DEV.cam, audiooutput: DEV.spk || 'default' };
  const sel = (kind, label, id) => { const ds = list.filter(d => d.kind === kind); if (!ds.length) return '';
    return `<label>${t(label)}<select data-k="${kind}">${ds.map((d, i) => `<option value="${esc(d.deviceId)}" ${d.deviceId === cur[kind] ? 'selected' : ''}>${esc(d.label || t(label).replace(/^\S+\s/, '') + ' ' + (i + 1))}</option>`).join('')}</select></label>`; };
  box.innerHTML = sel('audioinput', 'call_micDev') + sel('videoinput', 'call_camDev') + (('setSinkId' in HTMLMediaElement.prototype) ? sel('audiooutput', 'call_spk') : '');
  box.querySelectorAll('select').forEach(s => s.onchange = () => switchDevice(s.dataset.k, s.value));
}
async function switchDevice(kind, id) {
  if (kind === 'audiooutput') { DEV.spk = id; saveDev(); for (const a of audios.values()) if (a.setSinkId) a.setSinkId(id).catch(() => toast(t('call_noSpk'))); return; }
  if (kind === 'audioinput') {
    DEV.mic = id; saveDev();
    try { const st = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: id }, echoCancellation: true, noiseSuppression: true } }), tr = st.getAudioTracks()[0];
      if (L.audio) { L.stream.removeTrack(L.audio); L.audio.stop(); } L.audio = tr; L.stream.addTrack(tr); tr.enabled = L.mic;
      for (const p of peers.values()) p.aT.sender.replaceTrack(tr).catch(() => {}); } catch (e) { toast(t('call_denied')); }
  }
  if (kind === 'videoinput') {
    DEV.cam = id; saveDev();
    if (L.cam) try { const st = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: id }, width: { ideal: 1280 }, height: { ideal: 720 } } }), tr = st.getVideoTracks()[0];
      if (L.video) { L.stream.removeTrack(L.video); L.video.stop(); } L.video = tr; L.stream.addTrack(tr); if (inCall) pushVideo(); } catch (e) { toast(t('call_denied')); }
  }
  if (inCall) { send('st', myState()); drawCall(); drawTiles(); } else drawLobby();
}
function drawLobby() {
  $('lTitle').textContent = t('call_title'); $('lRoom').textContent = t('call_room') + ': ' + ROOM;
  $('lMic').textContent = t('call_mic') + ': ' + t(L.mic && L.audio ? 'call_on' : 'call_off'); $('lMic').disabled = !L.audio;
  $('lCam').textContent = t('call_cam') + ': ' + t(L.cam && L.video ? 'call_on' : 'call_off'); $('lCam').disabled = !L.video;
  $('lName').placeholder = t('call_name'); $('lJoin').textContent = t('call_join'); $('lNote').textContent = t('call_note');
  const pv = $('pv'); pv.srcObject = L.video && L.cam ? new MediaStream([L.video]) : null; pv.hidden = !(L.video && L.cam);
  $('pvAv').hidden = !pv.hidden; $('pvAv').className = 'av'; $('pvAv').style.cssText = 'width:90px;height:90px;border-radius:50%;background:#232a48;color:#ffb703;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center';
  $('pvAv').textContent = initials($('lName').value || ME.name);
}
$('lMic').onclick = () => { L.mic = !L.mic; if (L.audio) L.audio.enabled = L.mic; drawLobby(); };
$('lCam').onclick = () => { L.cam = !L.cam; if (L.video) L.video.enabled = L.cam; drawLobby(); };
$('lName').oninput = drawLobby;
$('lHome').onclick = () => { if (window.opener) window.close(); location.href = 'play.html'; };
$('lJoin').onclick = () => {
  const n = $('lName').value.trim(); if (!n) { $('lName').focus(); return; }
  ME.name = n.slice(0, 24); if (!Auth.profile) Auth.setGuestName(ME.name);
  if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  join();
};
async function loadRoles() {
  try { const { data, error } = await sb.rpc('call_room_open', { p_token: (window.Auth && Auth.token) || null, p_room: ROOM }); if (error) throw error;
    if (data) ROLES = { host: data.host, cohosts: data.cohosts || [], banned: data.banned || [] }; return true; }
  catch (e) { if (/group/i.test(e.message || '')) return 'group'; return true; }   // no room info: everyone is equal
}

// ---------------- the call ----------------
function send(ev, payload) { if (ch) ch.send({ type: 'broadcast', event: ev, payload: Object.assign({ from: ME.id }, payload) }); }
function myState() { return { name: ME.name, mic: !!(L.audio && L.mic), cam: !!(L.video && L.cam), share: !!L.screen }; }
async function join(force) {
  $('lJoin').disabled = true; $('lJoin').textContent = t('call_checking');
  const ok = await loadRoles();
  if (ok === 'group') { $('lErr').textContent = t('call_groupOnly'); $('lJoin').disabled = false; drawLobby(); return; }
  if (ROLES.banned.includes(UID)) { $('lErr').textContent = t('call_banned'); $('lJoin').disabled = false; drawLobby(); return; }
  if (ch) { try { sb.removeChannel(ch); } catch (e) {} ch = null; }
  if (L.audio) L.audio.enabled = L.mic;
  ch = sb.channel('call-' + ROOM, { config: { broadcast: { self: false }, presence: { key: ME.id, enabled: true } } });
  let firstSync; const synced = new Promise(r => firstSync = r);
  ch.on('broadcast', { event: 'sig' }, ({ payload }) => onSignal(payload).catch(e => console.warn('signal', e)));
  ch.on('broadcast', { event: 'st' }, ({ payload }) => { const p = peers.get(payload.from); if (p) { p.st = payload; p.name = payload.name || p.name; drawTiles(); } });
  ch.on('broadcast', { event: 'msg' }, ({ payload }) => addMsg(payload.name, payload.text, false));
  ch.on('broadcast', { event: 'bye' }, ({ payload }) => dropPeer(payload.from, true));
  ch.on('broadcast', { event: 'cmd' }, ({ payload }) => onCmd(payload));
  ch.on('broadcast', { event: 'roles' }, () => loadRoles().then(() => { drawTiles(); drawSide(); }));
  ch.on('broadcast', { event: 'dup' }, ({ payload }) => { if (payload.uid === UID && payload.keep !== ME.id && inCall) leaveCall('call_moved'); });
  ch.on('presence', { event: 'sync' }, () => { firstSync(); if (inCall) syncPeers(); });
  ch.subscribe();
  await Promise.race([synced, new Promise(r => setTimeout(r, 3000))]);
  // the same account can only be in a call once
  const all = ch.presenceState(), dupe = Object.keys(all).some(k => k !== ME.id && (all[k][0] || {}).uid === UID);
  if (dupe && !force) {
    $('lJoin').disabled = false; drawLobby();
    $('lErr').innerHTML = `<div class="dupbox"><span>${t('call_dup')}</span><button class="btn" id="lMove">${t('call_moveHere')}</button></div>`;
    $('lMove').onclick = () => { send('dup', { uid: UID, keep: ME.id }); $('lErr').textContent = ''; setTimeout(() => join(true), 700); };
    return;
  }
  $('lobby').hidden = true; $('call').hidden = false; inCall = true; ME.at = Date.now();
  await ch.track({ name: ME.name, uid: UID, at: ME.at });
  watchInbox();
  drawCall(); drawTiles();
}
// host / co-host commands (checked against the room's roles from the database)
function onCmd(c) {
  if (c.to !== ME.id || !inCall || !canManage(c.uid)) return;
  if (c.action === 'mute' && L.audio && L.mic) { L.mic = false; L.audio.enabled = false; send('st', myState()); drawCall(); drawTiles(); toast(t('call_mutedBy', { p: c.name || t('call_host') })); }
  if (c.action === 'kick') leaveCall('call_kicked');
}
async function manage(peerId, action) {
  const p = peers.get(peerId); if (!p) return;
  if (action === 'mute') send('cmd', { to: peerId, action: 'mute', uid: UID, name: ME.name });
  if (action === 'kick' || action === 'cohost' || action === 'uncohost') {
    if (p.uid && window.Auth && Auth.token && (action === 'kick' || !p.uid.startsWith('guest-'))) {
      try { const { data, error } = await sb.rpc('call_room_set', { p_token: Auth.token, p_room: ROOM, p_action: action === 'kick' ? 'ban' : action, p_target: p.uid }); if (error) throw error;
        ROLES = { host: data.host, cohosts: data.cohosts || [], banned: data.banned || [] }; send('roles', {}); } catch (e) { toast(e.message); if (action !== 'kick') return; }
    }
    if (action === 'kick') { send('cmd', { to: peerId, action: 'kick', uid: UID }); setTimeout(() => dropPeer(peerId, true), 400); }
  }
  drawTiles(); drawSide();
}
function muteAll() { for (const p of peers.values()) if (!canManage(p.uid) || isHost(UID)) send('cmd', { to: p.id, action: 'mute', uid: UID, name: ME.name }); }
// my own inbox in this window: hear when someone I'm ringing declines
let inbox = null;
function watchInbox() {   // the site chat (chat.js) already listens to my inbox and re-sends every ping as an event
  if (inbox) return; inbox = true;
  document.addEventListener('mal3ab-ping', (e) => { const p = e.detail; if (p && p.declined && new RegExp('[?&]room=' + ROOM + '(&|$)').test(p.declined)) toast('📵 ' + t('call_declined', { p: p.name || '…' })); });
}
// tell the friends I was ringing that I hung up before anyone answered (their ringing stops)
function cancelRing() {
  if (!RING.length || answered || !window.Auth || !Auth.user) return;
  for (const id of RING) {
    if (window.Chat && Chat.ping) { Chat.ping(id, { cancel: LINK, name: (Auth.profile && Auth.profile.username) || ME.name }); continue; }
    const c = sb.channel('inbox-' + id, { config: { broadcast: { self: false, ack: false } } });
    c.subscribe((st) => { if (st === 'SUBSCRIBED') c.send({ type: 'broadcast', event: 'ping', payload: { from: Auth.user.id, cancel: LINK, name: ME.name } }); }); }
  RING.length = 0;
}
function syncPeers() {
  const all = ch.presenceState();
  // the same account opened the call twice: the older window gives way to the newer one
  if (Object.keys(all).some(k => k !== ME.id && (all[k][0] || {}).uid === UID && (all[k][0] || {}).at > ME.at)) { leaveCall('call_moved'); return; }
  const ids = new Set(Object.keys(all).filter(k => k !== ME.id && !ROLES.banned.includes((all[k][0] || {}).uid)));
  if (ids.size) { answered = true; RING.length = 0; }
  for (const id of ids) {
    const pr = all[id][0] || {};
    if (peers.has(id)) peers.get(id).uid = pr.uid;
    if (!peers.has(id)) { addPeer(id, pr.name || '…').uid = pr.uid; toast(t('call_joined', { p: pr.name || '…' })); }
    else if (pr.name && peers.get(id).name === '…') { peers.get(id).name = pr.name; peers.get(id).st.name = pr.name; }
  }
  for (const id of [...peers.keys()]) if (!ids.has(id)) dropPeer(id, true);
  send('st', myState()); drawTiles();
}
function addPeer(id, name) {
  if (peers.has(id)) return peers.get(id);
  const pc = new RTCPeerConnection(ICE);
  const p = { id, pc, name, stream: new MediaStream(), st: { name, mic: true, cam: true, share: false }, polite: ME.id > id, makingOffer: false, ignoreOffer: false };
  peers.set(id, p);
  // always one audio and one video slot, so turning the camera or screen share on later needs no new negotiation
  p.aT = pc.addTransceiver(L.audio || 'audio', { direction: 'sendrecv', streams: [L.stream] });
  p.vT = pc.addTransceiver(currentVideo() || 'video', { direction: 'sendrecv', streams: [L.stream] });
  pc.ontrack = (e) => { if (!p.stream.getTracks().includes(e.track)) p.stream.addTrack(e.track); e.track.onunmute = () => drawTiles(); drawTiles(); };
  pc.onicecandidate = ({ candidate }) => { if (candidate) send('sig', { to: id, candidate }); };
  pc.onnegotiationneeded = async () => { try { p.makingOffer = true; await pc.setLocalDescription(); send('sig', { to: id, description: pc.localDescription }); } catch (e) { console.warn(e); } finally { p.makingOffer = false; } };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') try { pc.restartIce(); } catch (e) {} drawTiles(); };
  return p;
}
async function onSignal({ from, to, description, candidate }) {   // "perfect negotiation": no matter who starts, the call connects
  if (to !== ME.id || !inCall) return;
  const p = peers.get(from) || addPeer(from, '…'), pc = p.pc;
  if (description) {
    const collision = description.type === 'offer' && (p.makingOffer || pc.signalingState !== 'stable');
    p.ignoreOffer = !p.polite && collision; if (p.ignoreOffer) return;
    await pc.setRemoteDescription(description);
    if (description.type === 'offer') { await pc.setLocalDescription(); send('sig', { to: from, description: pc.localDescription }); }
  } else if (candidate) { try { await pc.addIceCandidate(candidate); } catch (e) { if (!p.ignoreOffer) console.warn(e); } }
}
function dropPeer(id, say) {
  const p = peers.get(id); if (!p) return;
  try { p.pc.close(); } catch (e) {} peers.delete(id); if (spotlight === id) spotlight = null;
  if (say) toast(t('call_left', { p: p.name })); drawTiles();
}
const currentVideo = () => L.screen || (L.cam ? L.video : null);
function pushVideo() { for (const p of peers.values()) if (p.vT) p.vT.sender.replaceTrack(currentVideo()).catch(() => {}); send('st', myState()); drawTiles(); }

// ---- buttons ----
async function toggleMic() {
  if (!L.audio) { const a = await getMedia('audio'); if (!a.getAudioTracks) { toast(t('call_denied')); return; } L.audio = a.getAudioTracks()[0]; L.stream.addTrack(L.audio); for (const p of peers.values()) p.aT.sender.replaceTrack(L.audio); L.mic = true; }
  else { L.mic = !L.mic; L.audio.enabled = L.mic; }
  send('st', myState()); drawCall(); drawTiles();
}
async function toggleCam() {
  if (L.cam && L.video) { L.cam = false; L.video.stop(); L.stream.removeTrack(L.video); L.video = null; pushVideo(); drawCall(); return; }   // camera light goes off
  const v = await getMedia('video'); if (!v.getVideoTracks) { toast(t('call_denied')); return; }
  L.video = v.getVideoTracks()[0]; L.stream.addTrack(L.video); L.cam = true; pushVideo(); drawCall();
}
async function toggleShare() {
  if (L.screen) { L.screen.stop(); L.screen = null; pushVideo(); drawCall(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { toast(t('call_noShare')); return; }
  try {
    const s = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false });
    L.screen = s.getVideoTracks()[0]; L.screen.onended = () => { if (L.screen) { L.screen = null; pushVideo(); drawCall(); } };
    spotlight = 'me'; pushVideo(); drawCall();
  } catch (e) { if (!/NotAllowed|Abort/i.test(e.name)) toast(t('call_noShare')); }
}
function hangUp() { leaveCall('call_bye'); }
function leaveCall(why) {
  cancelRing(); send('bye', {}); inCall = false;
  for (const id of [...peers.keys()]) dropPeer(id, false);
  try { ch.untrack(); sb.removeChannel(ch); } catch (e) {} ch = null;
  for (const tr of [L.audio, L.video, L.screen]) if (tr) tr.stop();
  document.body.innerHTML = `<div style="position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#0b0e1a;color:#eef0ff;font-family:Segoe UI,Tahoma,sans-serif">
    <div style="font-size:48px">${why === 'call_kicked' ? '🚫' : '📞'}</div><b style="font-size:20px;text-align:center;padding:0 16px">${t(why || 'call_bye')}</b>
    <div style="display:flex;gap:10px"><button class="btn" onclick="location.reload()">${t('call_back')}</button><button class="btn sec" onclick="window.close();location.href='play.html'">${t('call_close')}</button></div></div>`;
}
$('bMic').onclick = toggleMic; $('bCam').onclick = toggleCam; $('bShare').onclick = toggleShare; $('bHang').onclick = hangUp;
$('bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
$('bPeople').onclick = () => { sidePanel = sidePanel === 'people' ? null : 'people'; drawSide(); };
$('bChat').onclick = () => { sidePanel = sidePanel === 'chat' ? null : 'chat'; $('bChat').dataset.n = ''; drawSide(); if (sidePanel) setTimeout(() => $('chatIn').focus(), 50); };
$('cLink').onclick = () => { navigator.clipboard.writeText(LINK).then(() => { $('cLink').textContent = t('call_copied'); setTimeout(drawCall, 1500); }); };
$('chatform').onsubmit = (e) => { e.preventDefault(); const v = $('chatIn').value.trim(); if (!v) return; send('msg', { name: ME.name, text: v.slice(0, 500) }); addMsg(ME.name, v, true); $('chatIn').value = ''; };
window.addEventListener('pagehide', () => { if (inCall) { cancelRing(); send('bye', {}); } });
$('bSet').onclick = () => { sidePanel = sidePanel === 'settings' ? null : 'settings'; drawSide(); };

// ---- drawing ----
function drawCall() {
  const set = (id, icon, on, label) => { const b = $(id); b.innerHTML = icon + `<small>${label}</small>`; b.classList.toggle('off', on === false); b.classList.toggle('on', on === 'on'); b.title = label; };
  set('bMic', L.mic && L.audio ? '🎤' : '🔇', !!(L.mic && L.audio), t('call_mic').replace(/^\S+\s/, ''));
  set('bCam', L.cam && L.video ? '📷' : '🚫', !!(L.cam && L.video), t('call_cam').replace(/^\S+\s/, ''));
  set('bShare', '🖥️', L.screen ? 'on' : null, L.screen ? t('call_stopShare') : t('call_share'));
  set('bChat', '💬', null, t('call_chat')); set('bPeople', '👥', null, t('call_people')); set('bSet', '⚙️', null, t('call_settings')); set('bFull', '⛶', null, t('call_full'));
  $('bHang').title = t('call_hang'); $('bHang').innerHTML = '📞<small>' + t('call_hang') + '</small>';
  $('cLink').textContent = t('call_link'); $('cCount').textContent = t('call_count', { n: peers.size + 1 });
  $('langslot').innerHTML = langButton().replace('btn small secondary langbtn', 'pill langbtn');
}
function tileFor(key, name, stream, st, me) {
  const d = document.createElement('div'); d.className = 'tile' + (me ? ' me' : '') + (st.share ? ' screen' : ''); d.dataset.key = key;
  const showVideo = stream && stream.getVideoTracks().some(tr => tr.readyState === 'live' && !tr.muted) && (st.cam || st.share);
  if (showVideo) { const v = document.createElement('video'); v.autoplay = true; v.playsInline = true; v.muted = true; v.srcObject = stream; d.appendChild(v); }
  else { const a = document.createElement('div'); a.className = 'av'; a.textContent = initials(name); d.appendChild(a); }
  d.insertAdjacentHTML('beforeend', `<div class="tag">${st.mic ? '🎤' : '🔇'}${st.share ? ' 🖥️' : ''}<span dir="auto">${esc(me ? name + ' (' + t('call_you') + ')' : name)}</span></div><button class="big" title="⛶">⛶</button>`);
  d.querySelector('.big').onclick = () => { spotlight = spotlight === key ? null : key; drawTiles(); };
  return d;
}
const audios = new Map();   // remote voices play through hidden <audio> elements (video tiles are muted)
function drawTiles() {
  if (!inCall) return;
  const spot = $('spot'), grid = $('grid'); spot.innerHTML = ''; grid.innerHTML = '';
  if (!spotlight) { for (const p of peers.values()) if (p.st.share) { spotlight = p.id; break; } }
  if (spotlight && spotlight !== 'me' && !peers.has(spotlight)) spotlight = null;
  const items = [{ key: 'me', name: ME.name, stream: new MediaStream(currentVideo() ? [currentVideo()] : []), st: myState(), me: true }]
    .concat([...peers.values()].map(p => ({ key: p.id, name: p.name, stream: p.stream, st: p.st, conn: p.pc.connectionState })));
  for (const it of items) {
    const tile = tileFor(it.key, it.name, it.stream, it.st, it.me);
    if (it.conn && it.conn !== 'connected') tile.insertAdjacentHTML('beforeend', `<div class="conn">${t('call_connecting')}</div>`);
    (spotlight === it.key ? spot : grid).appendChild(tile);
  }
  if (!peers.size) grid.insertAdjacentHTML('beforeend', `<div class="tile"><div style="color:var(--muted);text-align:center;padding:20px">${t('call_alone')}<br><br><button class="pill" onclick="document.getElementById('cLink').click()">${t('call_link')}</button></div></div>`);
  for (const p of peers.values()) {
    let a = audios.get(p.id); if (!a) { a = new Audio(); a.autoplay = true; audios.set(p.id, a); if (DEV.spk && a.setSinkId) a.setSinkId(DEV.spk).catch(() => {}); }
    if (a.srcObject !== p.stream) { a.srcObject = p.stream; a.play().catch(() => {}); }
  }
  for (const [id, a] of audios) if (!peers.has(id)) { a.srcObject = null; audios.delete(id); }
  $('cCount').textContent = t('call_count', { n: peers.size + 1 });
  if (sidePanel === 'people') drawSide();
}
function drawSide() {
  $('side').hidden = !sidePanel;
  $('people').hidden = sidePanel !== 'people'; $('setp').hidden = sidePanel !== 'settings'; $('msgs').hidden = $('chatform').hidden = sidePanel !== 'chat';
  $('sideT').innerHTML = (sidePanel === 'chat' ? '💬 ' + t('call_chat') : sidePanel === 'settings' ? '⚙️ ' + t('call_settings') : '👥 ' + t('call_people')) + `<button class="pill" onclick="sidePanel=null;drawSide()">✕</button>`;
  $('chatIn').placeholder = t('call_type'); $('chatSend').textContent = t('call_send');
  if (sidePanel === 'settings') drawDevices($('setp'));
  if (sidePanel === 'people') {
    const mine = canManage(UID), badge = (uid) => isHost(uid) ? `<span class="badge">${t('call_host')}</span>` : isCo(uid) ? `<span class="badge co">${t('call_cohost')}</span>` : '';
    const acts = (p) => {
      if (!mine || isHost(p.uid) || (isCo(p.uid) && !isHost(UID))) return '';
      const real = p.uid && !p.uid.startsWith('guest-');
      return `<span class="acts">${p.st.mic ? `<button data-m="mute" data-p="${p.id}" title="${t('call_mute')}">🔇</button>` : ''}`
        + (isHost(UID) && real ? `<button data-m="${isCo(p.uid) ? 'uncohost' : 'cohost'}" data-p="${p.id}" title="${t(isCo(p.uid) ? 'call_unCo' : 'call_makeCo')}">${isCo(p.uid) ? '☆' : '⭐'}</button>` : '')
        + `<button data-m="kick" data-p="${p.id}" title="${t('call_remove')}">🚫</button></span>`;
    };
    $('people').innerHTML = (mine && peers.size ? `<button class="btn" id="muteAll" style="margin-bottom:6px">${t('call_muteAll')}</button>` : '')
      + [`<div class="person"><span dir="auto">${esc(ME.name)} (${t('call_you')})</span>${badge(UID)}${L.mic ? '🎤' : '🔇'}${L.cam ? '📷' : ''}${L.share ? '🖥️' : ''}</div>`]
      .concat([...peers.values()].map(p => `<div class="person"><span dir="auto">${esc(p.name)}</span>${badge(p.uid)}${p.st.mic ? '🎤' : '🔇'}${p.st.cam ? '📷' : ''}${p.st.share ? '🖥️' : ''}${acts(p)}</div>`)).join('');
    $('people').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { if (b.dataset.m !== 'kick' || confirm(t('call_remove') + '?')) manage(b.dataset.p, b.dataset.m); });
    if ($('muteAll')) $('muteAll').onclick = muteAll;
  }
}
function addMsg(name, text, me) {
  const d = document.createElement('div'); d.className = 'm' + (me ? ' me' : ''); d.dir = 'auto'; d.innerHTML = `<b>${esc(name)}</b>${esc(text)}`; $('msgs').appendChild(d); $('msgs').scrollTop = 1e9;
  if (sidePanel !== 'chat' && !me) { toast('💬 ' + name + ': ' + text.slice(0, 60)); }
}
// speaking indicator: a green ring around whoever is talking
setInterval(() => {
  if (!inCall || !AC) return;
  const level = (stream, key) => {
    if (!stream || !stream.getAudioTracks().length) return 0;
    let m = level.cache.get(key); if (!m || m.stream !== stream) { try { const src = AC.createMediaStreamSource(stream), an = AC.createAnalyser(); an.fftSize = 256; src.connect(an); m = { stream, an, buf: new Uint8Array(an.fftSize) }; level.cache.set(key, m); } catch (e) { return 0; } }
    m.an.getByteTimeDomainData(m.buf); let s = 0; for (const v of m.buf) s += Math.abs(v - 128); return s / m.buf.length;
  };
  level.cache = level.cache || new Map();
  if (L.audio && (!L.aStream || L.aStream.getAudioTracks()[0] !== L.audio)) L.aStream = new MediaStream([L.audio]);
  const me = document.querySelector('.tile[data-key="me"]'); if (me) me.classList.toggle('speaking', L.mic && level(L.audio ? L.aStream : null, 'me') > 6);
  for (const p of peers.values()) { const el = document.querySelector(`.tile[data-key="${p.id}"]`); if (el) el.classList.toggle('speaking', level(p.stream, p.id) > 6); }
}, 200);
document.addEventListener('langchange', () => { if (inCall) { drawCall(); drawTiles(); drawSide(); } else drawLobby(); });

(async () => {
  await Auth.init().catch(() => {});
  ME.name = (window.Auth && Auth.name()) || ''; $('lName').value = ME.name;
  applyLang(); drawLobby(); setupDevices();
})();
window.Mal3abCall = { peers, L, ME, ROOM, join, toggleMic, toggleCam, toggleShare, hangUp };
</script>
