<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اكتشف الألعاب — ملعب</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  .search { display: flex; gap: 10px; justify-content: center; padding: 10px; flex-wrap: wrap; }
  .search input { width: min(90vw, 420px); letter-spacing: 0; text-transform: none; text-align: right; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  .g { background: var(--card); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .g img { width: 100%; aspect-ratio: 460/215; object-fit: cover; background: var(--card2); }
  .g .b { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .g h3 { margin: 0; font-size: 15px; direction: ltr; text-align: left; }
  .g small { color: var(--muted); }
  .g .score { color: var(--ok); font-weight: 700; }
</style>
</head>
<body>
<div class="topbar"><a class="back" href="index.html">← الرئيسية</a><div class="title">📚 اكتشف الألعاب</div><div class="room" id="count"></div></div>
<div class="search">
  <input id="q" placeholder="دوّر باسم اللعبة أو النوع (Action, RPG, Racing…)">
  <button class="btn" onclick="random()">🎲 اختارلي لعبة</button>
</div>
<div class="games" id="list"></div>
<script>
let ALL = [];
const list = document.getElementById('list');
fetch('shared/top5000_games.json').then(r => r.json()).then(d => { ALL = d; show(ALL.slice(0, 60)); document.getElementById('count').textContent = ALL.length + ' لعبة'; });
function show(items) {
  list.innerHTML = items.map(g => `
    <a class="g" href="${g.store_url}" target="_blank">
      <img loading="lazy" src="${g.image || ''}" alt="">
      <div class="b">
        <h3>${g.name}</h3>
        <small>${g.year || ''} · ${(g.genres || []).slice(0, 2).join(', ')}</small>
        <small>${(g.platforms || []).join(' / ')}</small>
        <span class="score">${g.steam_score ? '👍 ' + g.steam_score + '%' : ''} ${g.metacritic ? ' · MC ' + g.metacritic : ''}</span>
      </div>
    </a>`).join('');
}
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) return show(ALL.slice(0, 60));
  show(ALL.filter(g => g.name.toLowerCase().includes(q) || (g.genres || []).some(x => x.toLowerCase().includes(q)) || (g.tags || []).some(x => x.toLowerCase().includes(q))).slice(0, 120));
});
function random() { show([ALL[Math.floor(Math.random() * ALL.length)]]); }
</script>
</body>
</html>
