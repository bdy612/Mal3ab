<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملعب — Mal3ab</title>
<link rel="stylesheet" href="shared/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="shared/net.js"></script>
</head>
<body>
<div class="hero">
  <h1>🎮 ملعب</h1>
  <p>العب مع صاحبك على نفس الجهاز أو أونلاين بكود غرفة</p>
</div>

<div class="join">
  <span>عندك كود؟</span>
  <input id="code" maxlength="4" placeholder="ABCD">
  <button class="btn" onclick="joinRoom()">ادخل الغرفة</button>
</div>
<div class="msg" id="msg"></div>

<div class="grid" id="grid"></div>

<div style="text-align:center;padding:30px">
  <a class="btn secondary" href="catalog.html">📚 اكتشف 5000 لعبة من حول العالم</a>
</div>

<script>
const GAMES = [
  { id: 'tictactoe', icon: '❌⭕', name: 'إكس أو', desc: 'اللعبة الكلاسيكية. ٣ في صف واحد وتكسب.' },
  { id: 'connect4',  icon: '🔴🟡', name: 'كونكت ٤', desc: 'نزّل القرص في عمود، أول واحد يعمل ٤ في صف يكسب.' },
  { id: 'chess',     icon: '♞',   name: 'شطرنج', desc: 'شطرنج كامل بالقواعد الرسمية. اللاعب ١ أبيض.' },
];
const msg = document.getElementById('msg');
document.getElementById('grid').innerHTML = GAMES.map(g => `
  <div class="card">
    <div class="icon">${g.icon}</div>
    <h2>${g.name}</h2>
    <p>${g.desc}</p>
    <div class="actions">
      <a class="btn secondary" href="games/${g.id}.html">نفس الجهاز</a>
      <button class="btn" onclick="createRoom('${g.id}')">أونلاين</button>
    </div>
  </div>`).join('');

async function createRoom(game) {
  msg.textContent = 'بعمل الغرفة…';
  try {
    const code = await Net.create(game, {});
    location.href = `games/${game}.html?code=${code}&p=1`;
  } catch (e) { msg.textContent = e.message; }
}
async function joinRoom() {
  const code = document.getElementById('code').value;
  if (code.length < 4) { msg.textContent = 'اكتب الكود المكوّن من ٤ حروف'; return; }
  msg.textContent = 'بدخل…';
  try {
    const room = await Net.join(code);
    location.href = `games/${room.game}.html?code=${room.code}&p=2`;
  } catch (e) { msg.textContent = e.message; }
}
document.getElementById('code').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
</script>
</body>
</html>
