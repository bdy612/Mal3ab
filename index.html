<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملعب — Mal3ab</title>
<link rel="stylesheet" href="shared/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="shared/i18n.js"></script>
<script src="shared/net.js"></script>
</head>
<body>
<div class="topbar">
  <div class="title">🎮 <span data-i18n="app"></span></div>
  <div class="room" id="who"></div>
  <span id="langslot"></span>
</div>

<div class="hero">
  <h1>🎮 <span data-i18n="app"></span></h1>
  <p data-i18n="tagline"></p>
</div>

<div class="join">
  <span data-i18n="haveCode"></span>
  <input id="code" maxlength="4" placeholder="ABCD">
  <button class="btn" onclick="joinRoom()" data-i18n="enterRoom"></button>
</div>
<div class="msg" id="msg"></div>

<h2 class="section" data-i18n="boardGames"></h2>
<div class="grid" id="grid"></div>
<h2 class="section" data-i18n="myGames"></h2>
<div class="grid" id="grid2"></div>

<div style="text-align:center;padding:30px">
  <a class="btn secondary" href="history.html" data-i18n="history"></a>
</div>

<!-- account modal -->
<div class="modal" id="modal" hidden>
  <div class="box">
    <div class="tabs">
      <button class="tab active" onclick="tab('login')" data-i18n="login"></button>
      <button class="tab" onclick="tab('signup')" data-i18n="signup"></button>
    </div>
    <input id="username" class="text" data-i18n-ph="username" hidden>
    <input id="email" class="text" type="email" data-i18n-ph="email">
    <input id="password" class="text" type="password" data-i18n-ph="password">
    <button class="btn" id="submit" onclick="submitAuth()"></button>
    <div class="msg" id="amsg"></div>
    <hr>
    <div class="guest"><span data-i18n="orGuest"></span> <input id="guest" class="text" data-i18n-ph="username"> <button class="btn small secondary" onclick="saveGuest()">OK</button></div>
    <button class="btn tiny secondary close" onclick="modal.hidden=true">✕</button>
  </div>
</div>

<script>
const ONLINE = [
  { id: 'tictactoe', icon: '❌⭕', key: 'tictactoe' },
  { id: 'connect4',  icon: '🔴🟡', key: 'connect4' },
  { id: 'chess',     icon: '♞',   key: 'chess', clock: true },
];
const MINE = [
  { id: 'city-hall/index.html', icon: '🏙️', key: 'cityhall' },
  { id: 'turf-rush.html',       icon: '🏁', key: 'turfrush' },
  { id: 'pitch-legends/index.html', icon: '⚽', key: 'pitch' },
  { id: 'voxel/index.html',     icon: '🧱', key: 'voxel' },
];
const msg = document.getElementById('msg'), modal = document.getElementById('modal');
let mode = 'login';

function draw() {
  document.getElementById('langslot').innerHTML = langButton();
  document.getElementById('grid').innerHTML = ONLINE.map(g => `
    <div class="card">
      <div class="icon">${g.icon}</div>
      <h2>${t(g.key)}</h2>
      <p>${t(g.key + 'Desc')}</p>
      ${g.clock ? `<label class="clock">${t('timeControl')}:
        <select id="tc-${g.id}"><option value="0">${t('noClock')}</option><option value="3">3 ${t('min')}</option><option value="5">5 ${t('min')}</option><option value="10" selected>10 ${t('min')}</option><option value="15">15 ${t('min')}</option></select></label>` : ''}
      <div class="actions">
        <a class="btn secondary" href="games/${g.id}.html${g.clock ? '?tc=10' : ''}" onclick="${g.clock ? `this.href='games/${g.id}.html?tc='+document.getElementById('tc-${g.id}').value` : ''}">${t('sameDevice')}</a>
        <button class="btn" onclick="createRoom('${g.id}', ${!!g.clock})">${t('online')}</button>
      </div>
    </div>`).join('');
  document.getElementById('grid2').innerHTML = MINE.map(g => `
    <div class="card">
      <div class="icon">${g.icon}</div>
      <h2>${t(g.key)}</h2>
      <p>${t(g.key + 'Desc')}</p>
      <div class="actions"><a class="btn" href="games/${g.id}">${t('play')}</a></div>
    </div>`).join('');
  drawWho();
  applyLang();
}
function drawWho() {
  const w = document.getElementById('who');
  if (Auth.profile) {
    const p = Auth.profile;
    w.innerHTML = `👤 <b>${p.username}</b> · ${p.wins} ${t('wins')} · ${p.losses} ${t('losses')} · ${p.draws} ${t('draws')}
      <button class="btn tiny secondary" onclick="Auth.signOut()">${t('logout')}</button>`;
  } else {
    const g = Auth.name();
    w.innerHTML = `${g ? '👤 ' + g + ' (' + t('guest') + ')' : ''} <button class="btn small" onclick="openModal()">${t('login')} / ${t('signup')}</button>`;
  }
}
function openModal() { modal.hidden = false; tab('login'); document.getElementById('guest').value = Auth.name(); }
function tab(m) {
  mode = m;
  document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', (i === 0) === (m === 'login')));
  document.getElementById('username').hidden = m !== 'signup';
  document.getElementById('submit').textContent = t(m);
  document.getElementById('amsg').textContent = '';
}
async function submitAuth() {
  const email = document.getElementById('email').value.trim(), pw = document.getElementById('password').value, un = document.getElementById('username').value.trim();
  const am = document.getElementById('amsg');
  try {
    if (mode === 'signup') {
      const session = await Auth.signUp(email, pw, un);
      if (!session) { am.textContent = t('checkEmail'); return; }
    } else await Auth.signIn(email, pw);
    modal.hidden = true;
  } catch (e) { am.textContent = e.message; }
}
function saveGuest() { Auth.setGuestName(document.getElementById('guest').value.trim()); modal.hidden = true; drawWho(); }

async function ensureName() {
  if (Auth.name()) return true;
  const n = prompt(t('username'));
  if (!n) return false;
  Auth.setGuestName(n.trim()); drawWho();
  return true;
}
async function createRoom(game, clock) {
  if (!await ensureName()) return;
  msg.textContent = t('creating');
  try {
    const tc = clock ? document.getElementById('tc-' + game).value : '';
    const code = await Net.create(game, {});
    location.href = `games/${game}.html?code=${code}&p=1${tc ? '&tc=' + tc : ''}`;
  } catch (e) { msg.textContent = e.message; }
}
async function joinRoom(code) {
  code = code || document.getElementById('code').value;
  if (code.length < 4) { msg.textContent = t('codeHint'); return; }
  if (!await ensureName()) return;
  msg.textContent = t('joining');
  try {
    const room = await Net.join(code);
    location.href = `games/${room.game}.html?code=${room.code}&p=2`;
  } catch (e) { msg.textContent = e.message; }
}
document.getElementById('code').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
document.addEventListener('langchange', draw);
document.addEventListener('authchange', drawWho);

(async () => {
  await Auth.init();
  draw();
  const join = new URLSearchParams(location.search).get('join');
  if (join) { document.getElementById('code').value = join.toUpperCase(); joinRoom(join); }
})();
</script>
</body>
</html>
