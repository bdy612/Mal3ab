<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملعب — Mal3ab</title>
<meta name="description" content="Mal3ab — multiplayer games: chess, Connect 4, X-O, Turf Rush, Pitch Legends, City Hall, Voxel Sandbox, Voxel Strike, Brick Builder. Play on the web or install the Android / Windows app.">
<link rel="icon" href="icon.png">
<script>
  // old invite links (index.html?join=CODE …) and the apps go straight to the games
  if (/[?&](join|code|room)=/.test(location.search) || /Mal3abApp/.test(navigator.userAgent)) location.replace('play.html' + location.search);
</script>
<link rel="stylesheet" href="shared/style.css?v=1793353723">
<script src="shared/i18n.js?v=1793353723"></script>
<style>
  body { background: radial-gradient(ellipse at 50% -10%, #2a3366 0%, var(--bg) 60%); min-height: 100vh; }
  .land { max-width: 1040px; margin: 0 auto; padding: 18px 18px 50px; display: flex; flex-direction: column; gap: 26px; }
  .nav { display: flex; align-items: center; gap: 10px; }
  .nav .logo { font-size: 26px; font-weight: 900; color: var(--accent); display: flex; align-items: center; gap: 10px; }
  .nav .logo img { width: 38px; height: 38px; border-radius: 10px; }
  .nav .sp { flex: 1; }
  .hero { text-align: center; padding: 26px 0 6px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .hero h1 { margin: 0; font-size: clamp(36px, 7vw, 64px); line-height: 1.05; }
  .hero h1 b { color: var(--accent); }
  .hero p { margin: 0; color: var(--muted); font-size: clamp(16px, 2.2vw, 20px); max-width: 640px; }
  .ways { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; }
  .way { background: var(--card); border: 2px solid transparent; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; position: relative; }
  .way.best { border-color: var(--accent); box-shadow: 0 10px 40px rgba(255, 183, 3, .12); }
  .way .tag { position: absolute; top: -12px; inset-inline-end: 16px; background: var(--accent); color: #1a1200; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 20px; display: none; }
  .way.best .tag { display: block; }
  .way .ic { font-size: 40px; }
  .way h2 { margin: 0; font-size: 22px; }
  .way p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; flex: 1; }
  .way .btn { text-align: center; font-size: 17px; padding: 13px 18px; }
  .way small { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .games { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .chip { color: var(--text); background: var(--card); border-radius: 14px; padding: 9px 14px; display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 15px; }
  .chip span { font-size: 20px; }
  h3.sec { text-align: center; color: var(--muted); font-weight: 600; margin: 0; font-size: 16px; }
  .foot { text-align: center; color: var(--muted); font-size: 13px; }
  .ar .hero, .ar .way, .ar .foot, .ar h3.sec { direction: rtl; }
</style>
</head>
<body>
<div class="land">
  <div class="nav">
    <div class="logo"><img src="icon.png" alt=""> <span data-i18n="app"></span> <span class="ver" data-ver>v1.0</span></div>
    <div class="sp"></div>
    <span id="langslot"></span>
  </div>

  <div class="hero">
    <h1 id="h1"></h1>
    <p data-i18n="l_tag"></p>
  </div>

  <div class="ways">
    <div class="way" id="w-web">
      <span class="tag" data-i18n="l_best"></span>
      <div class="ic">🌐</div><h2 data-i18n="l_web"></h2><p data-i18n="l_webDesc"></p>
      <a class="btn" href="play.html" data-i18n="l_webBtn"></a>
    </div>
    <div class="way" id="w-apk">
      <span class="tag" data-i18n="l_best"></span>
      <div class="ic">🤖</div><h2 data-i18n="l_apk"></h2><p data-i18n="l_apkDesc"></p>
      <a class="btn" href="downloads/Mal3ab.apk" download data-i18n="l_apkBtn"></a>
      <small data-i18n="l_apkNote"></small>
    </div>
    <div class="way" id="w-exe">
      <span class="tag" data-i18n="l_best"></span>
      <div class="ic">🪟</div><h2 data-i18n="l_exe"></h2><p data-i18n="l_exeDesc"></p>
      <a class="btn" href="downloads/Mal3ab.exe" download data-i18n="l_exeBtn"></a>
      <small data-i18n="l_exeNote"></small>
    </div>
  </div>

  <h3 class="sec" data-i18n="l_games"></h3>
  <div class="games" id="games"></div>
  <div class="foot" data-i18n="l_foot"></div>
</div>
<script>
addStrings({
  l_title: 'كل الألعاب في <b>ملعب</b> واحد', l_tag: 'شطرنج، كورة، سباقات، عالم مكعبات، ضرب نار وبناء بالطوب — العب لوحدك أو مع أصحابك أونلاين.',
  l_best: 'مناسب لجهازك', l_web: 'العب على الموقع', l_webDesc: 'من غير تسطيب — يفتح على طول في المتصفح على أي جهاز.', l_webBtn: '▶ افتح نسخة الويب',
  l_apk: 'تطبيق أندرويد', l_apkDesc: 'ملعب كتطبيق على موبايلك أو التابلت، بشاشة كاملة ومن غير شريط المتصفح.', l_apkBtn: '⬇ نزّل APK',
  l_apkNote: 'لو الموبايل سألك، اسمح بالتسطيب من المصدر ده (Install unknown apps).',
  l_exe: 'برنامج ويندوز', l_exeDesc: 'ملعب كبرنامج على الكمبيوتر في نافذة لوحده — ملف واحد، من غير تسطيب.', l_exeBtn: '⬇ نزّل EXE',
  l_exeNote: 'لو ظهرت رسالة "Windows protected your PC" دوس More info وبعدين Run anyway.',
  l_games: 'الألعاب', l_foot: 'التطبيقات بتفتح نفس الموقع، فأي تحديث بيوصلها لوحده من غير ما تنزّلها تاني.'
}, {
  l_title: 'Every game in one <b>Mal3ab</b>', l_tag: 'Chess, football, racing, a block world, a shooter and brick building — play alone or online with your friends.',
  l_best: 'Best for your device', l_web: 'Play on the web', l_webDesc: 'Nothing to install — opens right away in the browser on any device.', l_webBtn: '▶ Open the web version',
  l_apk: 'Android app', l_apkDesc: 'Mal3ab as an app on your phone or tablet, full screen with no browser bar.', l_apkBtn: '⬇ Download APK',
  l_apkNote: 'If your phone asks, allow installing from this source (Install unknown apps).',
  l_exe: 'Windows app', l_exeDesc: 'Mal3ab as a program on your PC in its own window — one file, no installer.', l_exeBtn: '⬇ Download EXE',
  l_exeNote: 'If "Windows protected your PC" appears, click More info, then Run anyway.',
  l_games: 'Games', l_foot: 'The apps open the same website, so every update reaches them by itself — no need to download again.'
});
const GAMES = [['♞', 'chess'], ['⚽', 'pitch'], ['🏁', 'turfrush'], ['🏙️', 'cityhall'], ['🧱', 'voxel'], ['🔫', 'voxelstrike'], ['🏗️', 'bricks'], ['🔴', 'connect4'], ['❌', 'tictactoe']];
function draw() {
  document.getElementById('langslot').innerHTML = langButton();
  document.getElementById('h1').innerHTML = t('l_title');
  document.getElementById('games').innerHTML = GAMES.map(([i, k]) => `<a class="chip" href="play.html"><span>${i}</span>${t(k)}</a>`).join('');
  applyLang();
}
const ua = navigator.userAgent, best = /Android/i.test(ua) ? 'w-apk' : /Windows/i.test(ua) ? 'w-exe' : 'w-web';
document.getElementById(best).classList.add('best');
document.addEventListener('langchange', draw);
document.addEventListener('DOMContentLoaded', draw);
</script>
</body>
</html>
