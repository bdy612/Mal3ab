<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070814">
<title>Glitch Hopper — Mal3ab</title>
<style>
  :root { --bg: #0f1220; --card: #161a30; --card2: #222846; --text: #eef0ff; --muted: #9aa3c7; --accent: #ffb703; --cyan: #2de2ff; --pink: #ff2e88; --green: #39ff88; --red: #ff3b6b;
    --mono: ui-monospace, 'Cascadia Mono', Consolas, Menlo, 'Courier New', monospace; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070814; color: var(--text); font-family: 'Segoe UI', Tahoma, Arial, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  [hidden] { display: none !important; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

  /* small round icon buttons (pause / system bar) */
  .ib { width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(45, 226, 255, .35); background: rgba(10, 14, 32, .82); color: var(--text); font: 700 16px/1 inherit; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 0 12px rgba(45, 226, 255, .12) inset; }
  .ib:hover { border-color: var(--cyan); background: rgba(24, 34, 70, .9); }
  .ib.txt { width: auto; padding: 0 12px; font-size: 13px; }
  #pauseBtn { position: fixed; left: max(10px, env(safe-area-inset-left)); top: 10px; z-index: 6; font-size: 13px; letter-spacing: -2px; }
  body:not(.playing) #pauseBtn { display: none; }
  #sys { position: fixed; right: max(10px, env(safe-area-inset-right)); top: 10px; z-index: 12; display: flex; gap: 6px; }
  body.playing #sys { display: none; }

  /* overlay screens */
  #screen { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 64px 14px 18px; overflow-y: auto; }
  #screen:empty { display: none; }
  #screen.dim { background: rgba(4, 6, 16, .62); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  .panel { position: relative; width: min(520px, 100%); background: linear-gradient(180deg, rgba(22, 26, 52, .95), rgba(12, 15, 34, .96)); border: 1px solid rgba(45, 226, 255, .28); border-radius: 18px; padding: 20px 20px 18px; box-shadow: 0 0 0 1px rgba(255, 46, 136, .08), 0 18px 60px rgba(0, 0, 0, .55), 0 0 40px rgba(45, 226, 255, .08) inset; margin: auto; animation: pop .22s ease-out; }
  .panel.wide { width: min(860px, 100%); }
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  .ar .panel { direction: rtl; }
  .panel h2 { margin: 0 0 10px; font-size: 24px; letter-spacing: 1px; color: var(--cyan); text-shadow: 2px 0 rgba(255, 46, 136, .6), -2px 0 rgba(45, 226, 255, .5); }
  .panel h2.bad { color: var(--red); }
  .panel h2.good { color: var(--green); }
  .panel p { margin: 6px 0; color: #cdd3f4; line-height: 1.55; font-size: 15px; }
  .muted { color: var(--muted) !important; font-size: 13px !important; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: #1a1200; border: 0; border-radius: 12px; padding: 11px 18px; font: 800 16px inherit; font-family: inherit; cursor: pointer; box-shadow: 0 0 18px rgba(255, 183, 3, .25); transition: transform .08s, filter .15s; }
  .btn:hover { filter: brightness(1.08); } .btn:active { transform: scale(.97); }
  .btn:focus-visible, .ib:focus-visible, .lvl:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .btn.sec { background: var(--card2); color: var(--text); box-shadow: none; border: 1px solid rgba(255, 255, 255, .08); }
  .btn.small { padding: 7px 12px; font-size: 13px; font-weight: 700; }
  .btn.block { width: 100%; }
  .col { display: flex; flex-direction: column; gap: 9px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  /* title */
  .menu { text-align: center; }
  .logo { position: relative; display: inline-block; white-space: nowrap; font: 900 clamp(26px, 8.2vw, 54px)/1.05 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; color: #fff; margin: 4px 0 6px; direction: ltr; text-shadow: 0 0 22px rgba(45, 226, 255, .45); }
  .logo b { color: var(--accent); }
  .logo::before, .logo::after { content: attr(data-t); position: absolute; left: 0; top: 0; width: 100%; overflow: hidden; pointer-events: none; }
  .logo::before { color: var(--pink); transform: translate(-2px, 0); clip-path: inset(0 0 78% 0); animation: gl1 2.6s infinite steps(1); opacity: .7; }
  .logo::after { color: var(--cyan); transform: translate(2px, 0); clip-path: inset(82% 0 0 0); animation: gl2 3.1s infinite steps(1); opacity: .7; }
  @keyframes gl1 { 0%, 86%, 100% { transform: translate(-2px, 0); clip-path: inset(0 0 78% 0); } 88% { transform: translate(-7px, -1px); clip-path: inset(20% 0 50% 0); } 92% { transform: translate(5px, 1px); clip-path: inset(70% 0 5% 0); } }
  @keyframes gl2 { 0%, 80%, 100% { transform: translate(2px, 0); clip-path: inset(82% 0 0 0); } 83% { transform: translate(8px, 0); clip-path: inset(30% 0 40% 0); } 90% { transform: translate(-6px, 1px); clip-path: inset(5% 0 80% 0); } }
  .tag { color: #c6cdf2; font-size: 15px; margin: 4px 0 14px; }
  .hello { color: var(--accent); font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .totals { margin-top: 12px; color: var(--muted); font: 700 14px var(--mono); }
  .totals b { color: var(--accent); }
  .ar .totals, .ar .lvtag { font-family: inherit; letter-spacing: 0; }
  .hint { margin-top: 10px; font-size: 12px; color: var(--muted); }

  /* level grid */
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 6px 0 14px; }
  .lvl { position: relative; background: rgba(34, 40, 70, .75); border: 1px solid rgba(45, 226, 255, .22); border-radius: 14px; color: var(--text); padding: 10px 6px 8px; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 104px; transition: transform .08s, border-color .15s; }
  .lvl:hover:not([disabled]) { border-color: var(--cyan); transform: translateY(-2px); }
  .lvl .n { font: 900 22px var(--mono); color: var(--cyan); }
  .lvl .nm { font-size: 11.5px; color: #cfd5f5; text-align: center; line-height: 1.25; min-height: 28px; }
  .lvl .st { font-size: 14px; letter-spacing: 1px; color: #4a5178; } .lvl .st i { font-style: normal; color: var(--accent); text-shadow: 0 0 6px rgba(255, 183, 3, .6); }
  .lvl .gi { display: flex; gap: 2px; } .lvl .gi img { width: 14px; height: 14px; }
  .lvl .bt { font: 11px var(--mono); color: var(--muted); }
  .lvl[disabled] { opacity: .42; cursor: default; } .lvl[disabled] .n { color: var(--muted); }
  .lvl.cur { border-color: var(--accent); box-shadow: 0 0 14px rgba(255, 183, 3, .25); }

  /* how to play */
  .how { display: grid; gap: 8px; margin: 8px 0 12px; }
  .how .it { display: flex; gap: 10px; align-items: flex-start; background: rgba(34, 40, 70, .55); border-radius: 12px; padding: 8px 10px; }
  .how .it img { width: 34px; height: 34px; flex: none; }
  .how .it b { display: block; font-size: 14px; margin-bottom: 2px; }
  .how .it span { font-size: 13px; color: #c3c9ea; line-height: 1.45; }
  .keys { font-size: 12.5px; color: var(--muted); line-height: 1.6; background: rgba(0, 0, 0, .25); border-radius: 10px; padding: 8px 10px; }

  /* intro card */
  .lvtag { font: 800 13px var(--mono); color: var(--accent); letter-spacing: 2px; }
  .pattern { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0 6px; direction: ltr; }
  .pattern .ps { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 62px; background: rgba(34, 40, 70, .7); border-radius: 10px; padding: 6px 6px 5px; border: 1px solid rgba(255, 255, 255, .06); }
  .pattern .ps img { width: 26px; height: 26px; } .pattern .ps span { font-size: 11px; color: #cfd5f5; text-align: center; max-width: 90px; }
  .pattern .ar { align-self: center; color: var(--muted); font-size: 14px; }
  .pattern .ps small { font: 10px var(--mono); color: var(--muted); }
  .newg { display: flex; gap: 10px; align-items: center; background: rgba(255, 183, 3, .1); border: 1px solid rgba(255, 183, 3, .35); border-radius: 12px; padding: 8px 10px; margin: 8px 0; text-align: start; }
  .newg img { width: 38px; height: 38px; flex: none; } .newg b { color: var(--accent); font-size: 13px; display: block; } .newg span { font-size: 13px; color: #e2e6ff; }
  .warn { color: #ffd4dd; background: rgba(255, 59, 107, .12); border: 1px solid rgba(255, 59, 107, .35); border-radius: 10px; padding: 7px 10px; font-size: 13px; margin: 6px 0; }

  /* results */
  .stars { display: flex; justify-content: center; gap: 10px; margin: 6px 0 10px; direction: ltr; }
  .stars span { font-size: 44px; color: #2a3058; transform: scale(.4); opacity: 0; animation: starIn .45s ease-out forwards; text-shadow: none; }
  .stars span.on { color: var(--accent); text-shadow: 0 0 18px rgba(255, 183, 3, .7); }
  @keyframes starIn { 60% { transform: scale(1.25); opacity: 1; } to { transform: scale(1); opacity: 1; } }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 6px 0 10px; }
  .stats div { background: rgba(34, 40, 70, .6); border-radius: 10px; padding: 7px 4px; text-align: center; }
  .stats small { display: block; font-size: 11px; color: var(--muted); } .stats b { font: 800 17px var(--mono); }
  .checks { list-style: none; padding: 0; margin: 0 0 12px; font-size: 13.5px; }
  .checks li { padding: 3px 0; color: #9aa3c7; } .checks li.ok { color: #e8ecff; } .checks li::before { content: '☆ '; color: #4a5178; } .checks li.ok::before { content: '★ '; color: var(--accent); }
  .record { color: var(--green); font-weight: 800; font-size: 14px; text-align: center; margin-bottom: 8px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .55; } }

  /* touch controls */
  #touch { position: fixed; inset: auto 0 0 0; height: 0; z-index: 5; pointer-events: none; }
  body.playing.touch #touch { display: block; }
  #touch { display: none; }
  .tb { position: fixed; pointer-events: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(12, 18, 42, .5); border: 2px solid rgba(45, 226, 255, .45); color: rgba(220, 245, 255, .9); font: 800 26px/1 inherit; box-shadow: 0 0 16px rgba(45, 226, 255, .18) inset; transition: background .06s, transform .06s; }
  .tb.on { background: rgba(45, 226, 255, .35); transform: scale(.94); }
  .tb.f { border-color: rgba(140, 230, 255, .7); font-size: 22px; } .tb.f i { position: absolute; right: -2px; top: -4px; font: 800 12px var(--mono); font-style: normal; background: #7df9ff; color: #001; border-radius: 9px; padding: 1px 6px; }
  .tb.f.empty { opacity: .35; }
  body.rev .tb.mv { border-color: rgba(255, 59, 107, .8); }
  body.rev .tb.mv::after { content: '⇄'; position: absolute; top: -8px; font-size: 13px; color: #ff6d8f; }
  #touchLayer { position: fixed; inset: 0; z-index: 4; touch-action: none; display: none; }
  body.playing.touch #touchLayer { display: block; }

  #toast { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); z-index: 15; background: rgba(10, 14, 32, .92); border: 1px solid rgba(45, 226, 255, .4); color: var(--text); padding: 8px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity .25s; max-width: 90vw; text-align: center; }
  #toast.on { opacity: 1; }
  .ar #toast { direction: rtl; }

  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .lvl { min-height: 96px; }
    .panel { padding: 16px 14px 14px; }
    .panel h2 { font-size: 21px; }
    .stats b { font-size: 15px; }
  }
  @media (max-height: 520px) {
    #screen { padding-top: 56px; }
    .panel { padding: 12px 14px; } .tag { margin-bottom: 8px; } .col { gap: 6px; } .btn { padding: 8px 14px; }
    .lvl { min-height: 84px; padding: 6px 4px; } .grid { gap: 6px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../shared/i18n.js?v=1793356000"></script>
<script src="../../shared/net.js?v=1793356000"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="touchLayer"></div>
<div id="touch">
  <div class="tb mv" id="tL">◀</div><div class="tb mv" id="tR">▶</div>
  <div class="tb" id="tJ">▲</div><div class="tb f" id="tF">❄<i id="tFn">0</i></div>
</div>
<button id="pauseBtn" class="ib" title="Pause">❚❚</button>
<div id="sys">
  <button id="langBtn" class="ib txt" type="button">English</button>
  <button id="sndBtn" class="ib" type="button" title="Sound">🔊</button>
  <button class="ib" data-mal3ab-home title="Home" type="button">🏠</button>
  <button class="ib" data-mal3ab-chat title="Chat" type="button">💬</button>
</div>
<div id="screen"></div>
<div id="toast"></div>
<script src="core.js?v=1793356000"></script>
<script src="levels.js?v=1793356000"></script>
<script src="game.js?v=1793356000"></script>
<script src="../../shared/cloud.js?v=1793356000" data-game="glitch-hopper" data-keys="glitch-hopper-*"></script>
<script>
  document.querySelectorAll('[data-mal3ab-home]').forEach(h => { if (!h.onclick) h.onclick = () => location.href = '../../play.html'; });
</script>
</body>
</html>
