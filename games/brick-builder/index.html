<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Brick Builder — Mal3ab</title>
<style>
  :root { --bg: #0f1220; --card: #1a1f35; --card2: #232a48; --text: #eef0ff; --muted: #9aa3c7; --accent: #ffb703; --red: #ff5d73; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; color: var(--text); user-select: none; -webkit-user-select: none;
    background: radial-gradient(ellipse at 50% 30%, #e9f0fa 0%, #c3d1e6 55%, #8fa3c2 100%); }
  [hidden] { display: none !important; }
  #c { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .btn { background: var(--accent); color: #1a1200; border: 0; border-radius: 10px; padding: 9px 16px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn.sec { background: var(--card2); color: var(--text); } .btn.small { padding: 6px 11px; font-size: 13px; }

  #top { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; z-index: 5; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .brand { background: rgba(15, 18, 32, .88); border-radius: 14px; padding: 6px 8px 6px 12px; display: flex; align-items: center; gap: 8px; font-weight: 800; white-space: nowrap; }
  .brand b { color: var(--accent); }
  .brand button { background: var(--card2); color: var(--text); border: 0; border-radius: 9px; padding: 6px 10px; font: 600 13px inherit; cursor: pointer; font-family: inherit; }
  #tools { background: rgba(15, 18, 32, .88); border-radius: 14px; padding: 5px; display: flex; gap: 3px; align-items: center; overflow-x: auto; scrollbar-width: none; margin: 0 auto; }
  #tools::-webkit-scrollbar { display: none; }
  .tool { background: transparent; color: var(--text); border: 0; border-radius: 10px; padding: 5px 9px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-family: inherit; min-width: 52px; }
  .tool b { font-size: 19px; line-height: 1.2; } .tool span { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .tool.on { background: var(--accent); } .tool.on span { color: #1a1200; font-weight: 700; } .tool:hover:not(.on):not([disabled]) { background: var(--card2); }
  .tool[disabled] { opacity: .35; cursor: default; }
  .sep { width: 1px; align-self: stretch; background: rgba(255, 255, 255, .12); margin: 4px 3px; }

  #side { position: fixed; left: 10px; top: 86px; bottom: 54px; width: 236px; background: rgba(15, 18, 32, .9); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 4; }
  #side .col { display: flex; flex-direction: column; gap: 6px; min-height: 0; } #side .col.parts { flex: 1; }
  #tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tab { flex: 1; background: var(--card2); color: var(--muted); border: 0; border-radius: 8px; padding: 6px 4px; font: 600 12px inherit; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .tab.on { background: var(--accent); color: #1a1200; }
  #parts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; overflow-y: auto; flex: 1; align-content: start; scrollbar-width: thin; }
  .part { background: var(--card); border: 2px solid transparent; border-radius: 10px; padding: 4px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: var(--muted); font: 600 11px inherit; font-family: inherit; }
  .part img { width: 46px; height: 46px; } .part.on { border-color: var(--accent); color: var(--text); background: var(--card2); }
  .part span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph { grid-column: 1 / -1; font-size: 11px; font-weight: 700; color: var(--accent); margin: 4px 2px 0; letter-spacing: .3px; }
  .ph:first-child { margin-top: 0; }
  #usehint { position: fixed; z-index: 7; pointer-events: none; background: rgba(15, 18, 32, .9); color: var(--text); border: 1px solid rgba(255, 183, 3, .6); border-radius: 10px; padding: 5px 10px; font-size: 12px; line-height: 1.45; text-align: center; white-space: nowrap; }
  #usehint span { color: var(--accent); font-weight: 700; }
  #status b.pm { background: var(--accent); color: #1a1200; border-radius: 8px; padding: 2px 8px; }
  @media (hover: hover) { body.playing #side { opacity: .6; } body.playing #side:hover { opacity: 1; } }
  #modal p.ask { margin: 4px 0 6px; font-size: 16px; line-height: 1.5; }
  .ar #usehint { direction: rtl; }
  .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #colors, #bases { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  #colors { grid-template-columns: repeat(9, 1fr); gap: 4px; } #bases { grid-template-columns: repeat(7, 1fr); }
  .sw { aspect-ratio: 1; border-radius: 8px; border: 2px solid rgba(255, 255, 255, .15); background: var(--c); cursor: pointer; padding: 0; }
  .sw.trans { background: linear-gradient(135deg, var(--c) 0 50%, rgba(255, 255, 255, .55) 50%); opacity: .9; }
  .sw.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  #status { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); background: rgba(15, 18, 32, .85); border-radius: 12px; padding: 7px 14px; display: flex; gap: 12px; align-items: center; font-size: 13px; z-index: 4; max-width: calc(100vw - 20px); }
  #status b { color: var(--accent); white-space: nowrap; } #status span { color: var(--muted); }

  #modal { position: fixed; inset: 0; background: rgba(5, 8, 18, .55); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  #modal .box { background: var(--card); border-radius: 18px; padding: 18px; width: min(460px, 100%); max-height: 90vh; display: flex; flex-direction: column; gap: 10px; }
  #modal h2 { margin: 0; color: var(--accent); font-size: 20px; }
  #modal .row { display: flex; gap: 8px; align-items: center; } #modal .sp { flex: 1; }
  #modal input { flex: 1; font: 15px inherit; font-family: inherit; background: var(--card2); color: var(--text); border: 2px solid transparent; border-radius: 10px; padding: 8px 10px; }
  #modal .list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 60px; }
  #modal .item { display: flex; gap: 8px; align-items: center; background: var(--card2); border-radius: 10px; padding: 8px 10px; }
  #modal .item div { flex: 1; display: flex; flex-direction: column; } #modal .item small { color: var(--muted); }
  .muted { color: var(--muted); text-align: center; }
  .big { font-size: 22px; letter-spacing: 3px; color: var(--accent); }
  .toast { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); background: rgba(15, 18, 32, .92); color: var(--text); padding: 8px 16px; border-radius: 12px; z-index: 30; font-weight: 600; }
  .fhint { grid-column: 1 / -1; margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
  #cross { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; z-index: 6; pointer-events: none; display: none; }
  #cross::before, #cross::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .55); }
  #cross::before { left: 10px; top: 0; width: 2px; height: 22px; } #cross::after { top: 10px; left: 0; height: 2px; width: 22px; }
  body.flying #cross { display: block; }
  #quick { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); display: flex; gap: 5px; align-items: center; background: rgba(15, 18, 32, .85); padding: 5px; border-radius: 14px; z-index: 4; }
  .qs { position: relative; width: 46px; height: 46px; border-radius: 10px; border: 2px solid transparent; background: var(--card); cursor: pointer; padding: 0; }
  .qs img { width: 38px; height: 38px; } .qs i { position: absolute; left: 3px; top: 1px; font: 700 10px inherit; font-style: normal; color: var(--muted); }
  .qs.on { border-color: var(--accent); background: var(--card2); }
  .qc { width: 26px; height: 26px; border-radius: 8px; background: var(--c); border: 2px solid rgba(255, 255, 255, .5); margin: 0 4px; }
  .ar #status, .ar #modal .box, .ar .lbl { direction: rtl; }

  @media (max-width: 760px), (pointer: coarse) and (max-height: 520px) {
    #top { top: 6px; left: 6px; right: 6px; gap: 6px; }
    .brand { padding: 4px 6px; } .brand .name { display: none; }
    .tool { min-width: 40px; padding: 4px 6px; } .tool span { display: none; }
    #side { left: 6px; right: 6px; top: auto; bottom: 6px; width: auto; height: 132px; padding: 6px; flex-direction: row; gap: 6px; }
    #side .col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    #side .col.parts { flex: 1; }
    #tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .tab { flex: none; padding: 5px 8px; }
    #parts { display: flex; overflow-x: auto; overflow-y: hidden; gap: 5px; }
    .part { flex: none; width: 58px; } .part img { width: 38px; height: 38px; }
    .ph { flex: none; align-self: center; width: 46px; margin: 0; font-size: 10px; line-height: 1.25; text-align: center; white-space: normal; }
    #parts .fhint { flex: none; width: 230px; margin: 0; font-size: 10.5px; line-height: 1.35; white-space: normal; overflow-y: auto; }
    #side .col.cols { width: 150px; overflow-y: auto; } #colors { grid-template-columns: repeat(6, 1fr); gap: 3px; } #bases { grid-template-columns: repeat(6, 1fr); gap: 3px; }
    .lbl { display: none; }
    #status { bottom: 144px; font-size: 12px; padding: 5px 10px; } #status span { display: none; }
    #quick { display: none; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../shared/i18n.js?v=1793395000"></script>
<script src="../../shared/net.js?v=1793395000"></script>
<script src="../../shared/vendor/three.min.js?v=1793395000"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="brand"><span>🧱</span><span class="name"><b>Brick</b> Builder</span><button id="lang">EN</button><button data-mal3ab-home title="Home">🏠</button><button data-mal3ab-chat title="Chat">💬</button></div>
  <div id="tools"></div>
</div>
<div id="side">
  <div class="col parts"><div id="tabs"></div><div id="parts"></div></div>
  <div class="col cols"><div class="lbl" data-i18n="bb_colors"></div><div id="colors"></div><div class="lbl" data-i18n="bb_base"></div><div id="bases"></div></div>
</div>
<div id="quick"></div>
<div id="cross"></div>
<div id="status"></div>
<div id="usehint" hidden></div>
<div id="modal" hidden></div>
<script src="bricks.js?v=1793395000"></script>
<script src="../../shared/cloud.js?v=1793395000" data-game="bricks" data-keys="bricks-*"></script>
<script>
  // language button label + home fallback before the account finishes loading
  const lb = document.getElementById('lang'); const setLb = () => lb.textContent = getLang() === 'ar' ? 'English' : 'العربية'; setLb(); document.addEventListener('langchange', setLb);
  document.querySelectorAll('[data-mal3ab-home]').forEach(h => { if (!h.onclick) h.onclick = () => location.href = '../../play.html'; });
</script>
</body>
</html>
