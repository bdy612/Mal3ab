<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كونكت ٤ — ملعب</title>
<link rel="stylesheet" href="../shared/style.css?v=1793355395">
<style>
  .board { grid-template-columns: repeat(7, 1fr); width: min(95vw, 560px); direction: ltr; background: #1d4ed8; }
  .cell { aspect-ratio: 1; border-radius: 50%; background: var(--bg); }
  .cell:hover { background: #1b2140; }
  .cell.p1 { background: var(--p1); } .cell.p2 { background: #ffd60a; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/i18n.js?v=1793355395"></script>
<script src="../shared/net.js?v=1793355395"></script>
<script src="../shared/shell.js?v=1793355395"></script>
</head>
<body>
<div class="center"><div class="board" id="board"></div></div>
<script>
const R = 6, C = 7;
const board = document.getElementById('board');

function check(b, r, c) {
  const who = b[r][c];
  for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
    const cells = [[r, c]];
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (rr >= 0 && rr < R && cc >= 0 && cc < C && b[rr][cc] === who) { cells.push([rr, cc]); rr += dr * s; cc += dc * s; }
    }
    if (cells.length >= 4) return cells;
  }
  return null;
}

function drop(c, bot) {
  const st = S.state;
  if (st.winner || (!bot && !S.myTurn())) return;
  if (!S.ready()) return;
  let r = R - 1;
  while (r >= 0 && st.board[r][c]) r--;
  if (r < 0) return;
  st.board[r][c] = st.turn;
  const w = check(st.board, r, c);
  if (w) { st.winner = st.turn; st.line = w; }
  else if (st.board.every(row => row.every(Boolean))) st.winner = 'draw';
  else st.turn = st.turn === 1 ? 2 : 1;
  S.commit();
}

// ---- computer player (yellow) ----
const ORDER = [3, 2, 4, 1, 5, 0, 6];
function openRow(b, c) { for (let r = R - 1; r >= 0; r--) if (!b[r][c]) return r; return -1; }
function scoreBoard(b) {                       // heuristic for the computer (player 2)
  let s = 0;
  for (let r = 0; r < R; r++) if (b[r][3] === 2) s += 3; else if (b[r][3] === 1) s -= 3;
  const win = (a, n2, n1) => n2 && n1 ? 0 : n2 === 4 ? 1e5 : n1 === 4 ? -1e5 : n2 === 3 ? 6 : n2 === 2 ? 2 : n1 === 3 ? -8 : n1 === 2 ? -2 : 0;
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
    const er = r + dr * 3, ec = c + dc * 3; if (er < 0 || er >= R || ec < 0 || ec >= C) continue;
    let n1 = 0, n2 = 0; for (let k = 0; k < 4; k++) { const v = b[r + dr * k][c + dc * k]; if (v === 1) n1++; else if (v === 2) n2++; }
    s += win(0, n2, n1);
  }
  return s;
}
function search(b, depth, alpha, beta, me) {
  const sc = scoreBoard(b);
  if (Math.abs(sc) > 5e4 || depth === 0) return sc;
  const cols = ORDER.filter(c => openRow(b, c) >= 0); if (!cols.length) return 0;
  if (me) { let v = -Infinity; for (const c of cols) { const r = openRow(b, c); b[r][c] = 2; v = Math.max(v, search(b, depth - 1, alpha, beta, false) - (6 - depth)); b[r][c] = 0; alpha = Math.max(alpha, v); if (alpha >= beta) break; } return v; }
  let v = Infinity; for (const c of cols) { const r = openRow(b, c); b[r][c] = 1; v = Math.min(v, search(b, depth - 1, alpha, beta, true) + (6 - depth)); b[r][c] = 0; beta = Math.min(beta, v); if (alpha >= beta) break; } return v;
}
function botMove(level) {
  const b = S.state.board.map(row => row.slice()), cols = ORDER.filter(c => openRow(b, c) >= 0);
  const wins = (p) => cols.find(c => { const r = openRow(b, c); b[r][c] = p; const ok = !!check(b, r, c); b[r][c] = 0; return ok; });
  let pick;
  if (level === 'easy') pick = Math.random() < 0.5 ? (wins(2) ?? wins(1)) : undefined;
  else {
    const depth = level === 'hard' ? 6 : 3; let best = -Infinity;
    for (const c of cols) { const r = openRow(b, c); b[r][c] = 2; const v = search(b, depth - 1, -Infinity, Infinity, false); b[r][c] = 0; if (v > best) { best = v; pick = c; } }
  }
  if (pick == null) pick = cols[Math.floor(Math.random() * cols.length)];
  drop(pick, true);
}

Shell.start({
  botMove,
  title: 'connect4',
  newState: () => ({ board: Array.from({ length: R }, () => Array(C).fill(0)), turn: 1, winner: null, line: [] }),
  render() {
    const st = S.state;
    const inLine = (r, c) => (st.line || []).some(([a, b]) => a === r && b === c);
    board.innerHTML = st.board.map((row, r) => row.map((v, c) =>
      `<div class="cell ${v ? 'p' + v : ''} ${inLine(r, c) ? 'win' : ''}" onclick="drop(${c})"></div>`).join('')).join('');
  }
});
</script>
</body>
</html>
