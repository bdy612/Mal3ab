<style>
  :root { --bg: #0f1220; --card: #121a32; --card2: #1b2444; --text: #e8f1ff; --muted: #8d9ac4; --accent: #ffb703; --cy: #22e6ff; --mg: #ff3dd8; --lm: #9dff3d; --red: #ff3b4e;

  .ar .logo .g, .ar .logo .h { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; letter-spacing: 0; }

  @keyframes glitch { 0%, 88%, 100% { transform: none; clip-path: none; } 89% { transform: translate(-3px, 1px) skewX(-8deg); } 91% { transform: translate(3px, -1px); clip-path: inset(30% 0 40% 0); }

  .lt b { font: 800 18px var(--mono); color: var(--cc); } .lt span { font-size: 11px; color: #c6d0ee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .lt em { font-style: normal; color: var(--accent); font-size: 12px; letter-spacing: 1px; } .lt em u { text-decoration: none; color: #39426a; } .lt small { font: 600 10px var(--mono); color: var(--muted); }

  .stats small { color: var(--muted); font-size: 12px; } .stats b { font: 800 19px var(--mono); }

    padding: 3px 8px; font-size: 12px; min-width: 0; max-width: 240px; }
