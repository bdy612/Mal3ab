<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Deck of Dungeons — Mal3ab</title>
<style>
  :root { --bg: #0f1220; --card: #1a1f35; --card2: #232a48; --text: #eef0ff; --muted: #9aa3c7; --accent: #ffb703; --red: #ff5d73; --green: #5fdc7a;
    --line: rgba(255, 183, 3, .22); --topH: 52px; --cw: 96px; --ch: 124px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060c; color: var(--text); font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  button { font-family: inherit; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .gl { width: 18px; height: 18px; image-rendering: pixelated; vertical-align: middle; flex: none; }
  .px { image-rendering: pixelated; }

  /* ---------- top bar ---------- */
  #hud { position: fixed; top: 0; left: 0; right: 0; height: var(--topH); display: flex; align-items: center; gap: 6px; padding: 0 8px;
    background: linear-gradient(180deg, rgba(15, 18, 32, .97), rgba(15, 18, 32, .82)); border-bottom: 1px solid var(--line); z-index: 12; }
  #hud .grp { display: flex; align-items: center; gap: 5px; }
  #hud .mid { flex: 1; justify-content: center; gap: 6px; min-width: 0; }
  .hb { background: var(--card2); color: var(--text); border: 1px solid rgba(255, 255, 255, .08); border-radius: 10px; height: 36px; min-width: 36px; padding: 0 9px;
    font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
  .hb:hover { background: #2d3560; } .hb:active { transform: translateY(1px); }
  .hb.on { background: var(--accent); color: #1a1200; }
  .stat { display: flex; align-items: center; gap: 5px; background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .07); border-radius: 10px; padding: 3px 10px; height: 36px; font-weight: 800; font-size: 16px; white-space: nowrap; }
  .stat small { color: var(--muted); font-weight: 600; font-size: 11px; }
  .stat.loot b { color: #ffcc33; } .stat.mana b { color: #d4b4ff; }
  .stat.bump { animation: bump .35s; } @keyframes bump { 40% { transform: scale(1.15); } }
  .stat.hurt { animation: hurt .45s; } @keyframes hurt { 30% { transform: translateX(-3px); background: rgba(255, 60, 80, .4); } 60% { transform: translateX(3px); } }
  .wv { display: flex; flex-direction: column; align-items: center; line-height: 1.05; padding: 0 6px; min-width: 0; }
  .wv b { color: var(--accent); font-size: 14px; white-space: nowrap; } .wv span { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  #hud.menu .mid, #hud.menu .right { display: none; }
  #hud.menu { background: transparent; border-bottom: 0; }

  /* ---------- hand panel ---------- */
  #panel { position: fixed; z-index: 9; background: linear-gradient(180deg, rgba(15, 18, 32, .93), rgba(9, 10, 20, .98)); }
  #panel.bottom { left: 0; right: 0; bottom: 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; padding: 4px 8px calc(6px + env(safe-area-inset-bottom)); }
  #panel.side { right: 0; top: var(--topH); bottom: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; padding: 8px; gap: 8px; }
  #info { font-size: 12.5px; line-height: 1.35; color: var(--text); min-height: 34px; display: flex; align-items: center; gap: 8px; padding: 2px 4px; overflow: hidden; }
  #info .tx { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #info b { color: var(--accent); } #info .cb { color: #ffd98a; }
  #panel.side #info { min-height: 0; align-items: flex-start; background: rgba(0, 0, 0, .25); border-radius: 10px; padding: 8px; }
  #panel.side #info .tx { -webkit-line-clamp: 7; }
  #handRow { display: flex; gap: 8px; align-items: flex-end; flex: 1; min-height: 0; }
  #panel.side #handRow { flex-direction: column-reverse; align-items: stretch; }
  #hand { flex: 1; display: flex; align-items: flex-end; justify-content: center; min-width: 0; padding-top: 12px; height: 100%; }
  #panel.side #hand { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; justify-items: center; overflow-y: auto; padding-top: 8px; scrollbar-width: thin; }
  #panel.stack #handRow { flex-direction: column-reverse; align-items: stretch; gap: 4px; }
  #panel.stack #goBox { width: auto; flex-direction: row; align-items: center; gap: 8px; }
  #panel.stack #incoming { flex: 1; justify-content: flex-start; flex-wrap: nowrap; overflow: hidden; }
  #panel.stack #bGo { padding: 8px 14px; min-width: 128px; }
  #panel.stack #hand { padding-top: 10px; }
  #goBox { display: flex; flex-direction: column; gap: 5px; align-items: stretch; width: 128px; flex: none; }
  #panel.side #goBox { width: auto; }
  #incoming { display: flex; flex-wrap: wrap; gap: 2px 6px; justify-content: center; font-size: 11px; color: var(--muted); align-items: center; }
  #incoming .hi { display: inline-flex; align-items: center; gap: 1px; font-weight: 800; color: var(--text); font-size: 12px; cursor: pointer; }
  #incoming .hi img { width: 18px; height: 20px; image-rendering: pixelated; }
  #bGo { background: linear-gradient(180deg, #ffc93b, #f0a000); color: #1a1200; border: 0; border-radius: 12px; padding: 10px 8px; font-size: 15px; font-weight: 900; cursor: pointer;
    box-shadow: 0 4px 0 #8a5a00, 0 0 18px rgba(255, 183, 3, .35); display: flex; align-items: center; justify-content: center; gap: 6px; }
  #bGo:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a5a00; }
  #bGo.run { background: var(--card2); color: var(--muted); box-shadow: none; cursor: default; font-size: 13px; }
  #bGo.pulse { animation: gopulse 1.4s infinite; } @keyframes gopulse { 50% { box-shadow: 0 4px 0 #8a5a00, 0 0 30px rgba(255, 183, 3, .8); } }

  .card { position: relative; flex: none; width: var(--cw); height: var(--ch); border-radius: 10px; background: linear-gradient(180deg, #2a2344, #151220 70%);
    border: 2px solid var(--kc, #888); box-shadow: 0 4px 0 rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(0, 0, 0, .6); cursor: pointer; display: flex; flex-direction: column;
    align-items: center; padding: 6px 3px 4px; transition: transform .12s, box-shadow .12s, margin .12s; touch-action: none; }
  .card .cost { position: absolute; top: -7px; left: -7px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e2c8ff, #7a3fd0 70%);
    border: 2px solid #0b0712; font-size: 14px; font-weight: 900; line-height: 22px; text-align: center; color: #fff; text-shadow: 0 1px 0 #000; z-index: 2; }
  .card .art { width: 68%; max-width: 64px; aspect-ratio: 1; image-rendering: pixelated; border-radius: 6px; margin-bottom: 2px; }
  .card .nm { font-size: 12px; font-weight: 800; text-align: center; line-height: 1.1; flex: 1; display: flex; align-items: center; }
  .card .kd { font-size: 9.5px; color: var(--kc); text-transform: uppercase; letter-spacing: .4px; font-weight: 700; }
  .card.up .nm::after { content: '+'; color: var(--green); margin-inline-start: 2px; }
  .card:hover { transform: translateY(-5px); }
  .card.sel { transform: translateY(-12px); box-shadow: 0 0 0 2px var(--accent), 0 0 22px rgba(255, 183, 3, .7); z-index: 3; }
  .card.poor { filter: saturate(.35) brightness(.7); } .card.poor .cost { background: radial-gradient(circle at 35% 35%, #ffb0b0, #a02a3a 70%); }
  .card.new { animation: deal .35s backwards; } @keyframes deal { from { transform: translateY(40px) scale(.8); opacity: 0; } }
  .card .ds { display: none; font-size: 11px; color: var(--muted); text-align: center; line-height: 1.3; }
  .card.big { --cw: 150px; --ch: 214px; padding: 10px 8px 8px; }
  .card.big .art { width: 76px; } .card.big .nm { font-size: 15px; flex: none; margin: 2px 0; } .card.big .ds { display: block; flex: 1; } .card.big .kd { margin-top: 2px; }
  .card.big .cost { width: 30px; height: 30px; line-height: 26px; font-size: 16px; }
  .card.mini .nm { font-size: 11px; }
  .ar .card .nm, .ar .card .ds { direction: rtl; }
  .ghostcard { position: fixed; z-index: 40; pointer-events: none; opacity: .85; transform: translate(-50%, -60%) rotate(-4deg) scale(.9); }

  /* ---------- tooltip, banner, toast, boss bar ---------- */
  #tip { position: fixed; z-index: 20; pointer-events: none; max-width: 270px; background: rgba(12, 14, 26, .96); border: 1px solid rgba(255, 183, 3, .4); border-radius: 12px;
    padding: 8px 10px; font-size: 12.5px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0, 0, 0, .6); }
  #tip h4 { margin: 0 0 3px; font-size: 14px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
  #tip .row { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); margin: 3px 0; } #tip .row span { display: inline-flex; align-items: center; gap: 3px; }
  #tip .cmb { display: flex; align-items: center; gap: 6px; margin-top: 4px; padding: 4px 6px; border-radius: 8px; background: rgba(255, 255, 255, .05); }
  #tip .cmb b { color: var(--cc); } #tip .bad { color: var(--red); font-weight: 700; }
  .ar #tip, .ar .box, .ar #info, .ar #banner, .ar #toast { direction: rtl; }
  #banner { position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%); z-index: 25; pointer-events: none; text-align: center; opacity: 0; }
  #banner.show { animation: ban 1.9s ease-out forwards; }
  @keyframes ban { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 20% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%); } }
  #banner h2 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(28px, 7vw, 54px); letter-spacing: 2px; color: var(--bc, #ffcc33); text-shadow: 0 3px 0 #000, 0 0 24px var(--bc, #ffcc33); white-space: nowrap; }
  #banner p { margin: 4px 0 0; font-size: clamp(13px, 3.4vw, 18px); font-weight: 700; color: #fff; text-shadow: 0 2px 0 #000; }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 26; background: rgba(40, 10, 20, .95); color: #fff; border: 1px solid var(--red); padding: 8px 14px;
    border-radius: 12px; font-weight: 700; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: calc(100vw - 30px); text-align: center; }
  #toast.on { opacity: 1; } #toast.good { background: rgba(10, 30, 20, .95); border-color: var(--green); }
  #bossbar { position: fixed; left: 50%; transform: translateX(-50%); z-index: 11; width: min(420px, calc(100vw - 30px)); text-align: center; pointer-events: none; }
  #bossbar span { font-family: Georgia, serif; font-weight: 700; color: #ffd0d8; text-shadow: 0 2px 0 #000; font-size: 14px; }
  #bossbar div { height: 10px; background: #2a0c14; border: 2px solid #0b0712; border-radius: 6px; overflow: hidden; margin-top: 2px; box-shadow: 0 0 12px rgba(255, 60, 90, .4); }
  #bossbar i { display: block; height: 100%; background: linear-gradient(90deg, #ff2d55, #ff8a5a); transition: width .2s; }

  /* ---------- screens ---------- */
  #scr { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 14px; padding-top: max(14px, env(safe-area-inset-top));
    background: radial-gradient(ellipse at center, rgba(15, 18, 32, .5), rgba(4, 3, 9, .92)); }
  #scr.on { display: flex; } #scr.menu { background: radial-gradient(ellipse at center, rgba(15, 18, 32, .2), rgba(4, 3, 9, .78)); }
  .box { background: linear-gradient(180deg, rgba(25, 29, 52, .98), rgba(13, 15, 28, .98)); border: 1px solid rgba(255, 183, 3, .35); border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .06); padding: 18px; width: min(560px, 100%); max-height: calc(100vh - 28px); overflow-y: auto; scrollbar-width: thin; animation: pop .25s; }
  .box.wide { width: min(820px, 100%); }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } }
  .box h2 { margin: 0 0 6px; font-family: Georgia, 'Times New Roman', serif; color: var(--accent); font-size: 24px; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
  .box h3 { margin: 12px 0 6px; color: #ffd98a; font-size: 15px; }
  .box p { margin: 6px 0; line-height: 1.5; color: #d8dcf0; }
  .muted { color: var(--muted) !important; font-size: 13px; }
  .btn { background: linear-gradient(180deg, #ffc93b, #f0a000); color: #1a1200; border: 0; border-radius: 12px; padding: 11px 18px; font-size: 16px; font-weight: 900; cursor: pointer;
    box-shadow: 0 4px 0 #8a5a00; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a5a00; }
  .btn.sec { background: var(--card2); color: var(--text); box-shadow: 0 4px 0 #0a0c18; border: 1px solid rgba(255, 255, 255, .08); }
  .btn.red { background: #6a1f2e; color: #fff; box-shadow: 0 4px 0 #2a0810; }
  .btn.small { padding: 7px 12px; font-size: 13px; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .col { display: flex; flex-direction: column; gap: 10px; } .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .sp { flex: 1; }
  .center { justify-content: center; text-align: center; }
  .logo { text-align: center; margin: 4px 0 10px; }
  .logo .t { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(32px, 9vw, 52px); font-weight: 900; letter-spacing: 1px; line-height: 1;
    background: linear-gradient(180deg, #fff3c4, #ffcc33 45%, #d07a00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #000) drop-shadow(0 0 18px rgba(255, 160, 0, .35)); }
  .ar .logo .t { font-family: Tahoma, Arial, sans-serif; }
  .logo .s { color: #c9cde6; margin-top: 8px; font-size: 14px; }
  .logo .cards { display: flex; justify-content: center; gap: 0; margin-bottom: 8px; }
  .logo .cards img { width: 54px; height: 54px; border-radius: 8px; border: 2px solid #ffb703; image-rendering: pixelated; box-shadow: 0 4px 10px #000a; background: #15121f; }
  .logo .cards img:nth-child(1) { transform: rotate(-12deg) translateY(6px); } .logo .cards img:nth-child(3) { transform: rotate(12deg) translateY(6px); }
  .logo .cards img:nth-child(2) { transform: translateY(-4px); z-index: 1; }
  .menuBtns { display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%); margin: 0 auto; }
  .menuBtns .btn { width: 100%; }
  .dread { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 2px 0; }
  .dread b { min-width: 88px; text-align: center; color: #ff8a9a; }
  .best { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 10px; }
  .best span { display: inline-flex; align-items: center; gap: 4px; } .best b { color: var(--text); }
  .grid { display: flex; flex-wrap: wrap; gap: 14px 10px; justify-content: center; padding: 10px 2px; }
  .tabs { display: flex; gap: 6px; margin: 4px 0 8px; flex-wrap: wrap; }
  .tabs button { flex: 1; background: var(--card2); color: var(--muted); border: 0; border-radius: 10px; padding: 8px 6px; font-weight: 800; cursor: pointer; font-size: 13px; }
  .tabs button.on { background: var(--accent); color: #1a1200; }
  .entry { display: flex; gap: 10px; align-items: center; background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .06); border-radius: 12px; padding: 8px 10px; margin: 6px 0; }
  .entry .ic { display: flex; align-items: center; gap: 2px; flex: none; }
  .entry .ic img { width: 34px; height: 34px; image-rendering: pixelated; border-radius: 6px; background: #15121f; }
  .entry .ic .plus { color: var(--muted); font-weight: 900; }
  .entry .bd { flex: 1; min-width: 0; } .entry .bd b { color: var(--cc, var(--accent)); } .entry .bd div { font-size: 12.5px; color: #c9cde6; line-height: 1.4; }
  .entry.locked { opacity: .55; } .entry .ok { flex: none; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 10px 0; }
  .stats div { background: rgba(0, 0, 0, .3); border-radius: 10px; padding: 8px; text-align: center; } .stats b { display: block; font-size: 20px; color: var(--accent); } .stats small { color: var(--muted); }
  .relic { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 160px; background: linear-gradient(180deg, #262040, #151220); border: 2px solid var(--rc); border-radius: 14px; padding: 12px 10px; cursor: pointer; text-align: center; }
  .relic:hover { transform: translateY(-4px); box-shadow: 0 0 18px var(--rc); }
  .relic img { width: 48px; height: 48px; } .relic b { color: var(--rc); } .relic div { font-size: 12.5px; color: #c9cde6; }
  .howstep { display: flex; gap: 12px; align-items: center; margin: 8px 0; }
  .howstep .ic { flex: none; width: 56px; display: flex; justify-content: center; gap: 2px; }
  .howstep .ic img { width: 34px; height: 34px; image-rendering: pixelated; border-radius: 6px; }
  .howstep p { margin: 0; font-size: 14px; }
  .relicbar { display: flex; gap: 3px; } .relicbar img { width: 22px; height: 22px; cursor: pointer; }

  @media (max-height: 500px) {
    #panel.side { padding: 6px; gap: 5px; } #panel.side #info { padding: 5px 7px; } #panel.side #info .tx { -webkit-line-clamp: 3; }
    #bGo { padding: 7px 8px; } .box { padding: 12px; }
  }
  @media (max-width: 700px) {
    :root { --topH: 48px; }
    #hud { padding: 0 5px; gap: 4px; } .hb { height: 34px; min-width: 34px; padding: 0 7px; font-size: 13px; }
    .stat { padding: 2px 7px; height: 34px; font-size: 15px; } .stat small { display: none; }
    .wv span { display: none; } .wv b { font-size: 13px; }
    #goBox { width: 92px; } #bGo { font-size: 13px; padding: 9px 4px; }
    .card .nm { font-size: 10.5px; } .card .kd { display: none; } .card .cost { width: 22px; height: 22px; line-height: 18px; font-size: 12px; top: -6px; left: -5px; }
    #info { font-size: 11.5px; min-height: 32px; }
    .box { padding: 14px; } .box h2 { font-size: 20px; }
    .card.big { --cw: 104px; --ch: 176px; padding: 8px 4px 6px; } .card.big .art { width: 56px; } .card.big .nm { font-size: 12.5px; } .card.big .ds { font-size: 10.5px; }
    .relic { width: 100%; flex-direction: row; text-align: start; } .relic img { width: 36px; height: 36px; }
    .hide-s { display: none !important; }
    #hud:not(.menu) #bLang { display: none; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../shared/i18n.js?v=1793380190"></script>
<script src="../../shared/net.js?v=1793380190"></script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="menu">
  <div class="grp">
    <button class="hb" data-mal3ab-home title="Home">🏠</button>
    <button class="hb" data-mal3ab-chat title="Chat">💬</button>
    <button class="hb" id="bLang">English</button>
  </div>
  <div class="grp mid">
    <div class="wv"><b id="hWave"></b><span id="hAct"></span></div>
    <div class="stat loot" id="sLoot" title="Loot"><img class="gl" id="iLoot" alt=""><b id="hLoot">0</b></div>
    <div class="stat mana" id="sMana" title="Mana"><img class="gl" id="iMana" alt=""><b id="hMana">0</b></div>
    <button class="hb hide-s" id="bDeck"><img class="gl" id="iDeck" alt=""><span id="hDeck">0</span></button>
    <div class="relicbar hide-s" id="hRelics"></div>
  </div>
  <div class="grp right">
    <button class="hb" id="bSpeed">×1</button>
    <button class="hb" id="bPause" title="Pause"><img class="gl" id="iPause" alt=""></button>
    <button class="hb hide-s" id="bCodex" title="Codex"><img class="gl" id="iCodex" alt=""></button>
  </div>
</div>
<div id="panel" class="bottom" hidden>
  <div id="info"></div>
  <div id="handRow">
    <div id="hand"></div>
    <div id="goBox"><div id="incoming"></div><button id="bGo"></button></div>
  </div>
</div>
<div id="bossbar" hidden><span id="bossName"></span><div><i id="bossFill"></i></div></div>
<div id="tip" hidden></div>
<div id="banner"><h2 id="banT"></h2><p id="banS"></p></div>
<div id="toast"></div>
<div id="scr"></div>
<script src="dd-data.js?v=1793380190"></script>
<script src="dd-art.js?v=1793380190"></script>
<script src="dd-game.js?v=1793380190"></script>
<script src="dd-ui.js?v=1793380190"></script>
<script src="../../shared/cloud.js?v=1793380190" data-game="deck-of-dungeons" data-keys="deck-of-dungeons-*"></script>
<script>
  document.querySelectorAll('[data-mal3ab-home]').forEach(h => { if (!h.onclick) h.onclick = () => location.href = '../../play.html'; });
</script>
</body>
</html>
