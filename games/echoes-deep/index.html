<title>Echoes of the Deep — Mal3ab</title>
<style>
  :root { --bg: #0f1220; --card: #141a30; --card2: #232a48; --text: #eef0ff; --muted: #9aa3c7; --accent: #ffb703; --cyan: #4df3ff; --red: #ff5d73; --green: #5dffa0; --line: rgba(77, 243, 255, .16); }
  * { box-sizing: border-box; }

    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }

  /* top-right corner: pause / sound / language / Mal3ab home + chat */

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 20; }

  #hRight { position: absolute; top: calc(54px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

  #hRole { font-size: 12px; color: var(--muted); }
  #hAlert { position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%); font-size: 13px; font-weight: 700; color: #ffd0d6; background: rgba(120, 10, 30, .65); border: 1px solid rgba(255, 93, 115, .6); border-radius: 12px; padding: 6px 12px; white-space: nowrap; animation: pop .25s; }
  #sigPop { position: absolute; left: 50%; top: 24%; transform: translate(-50%, -50%); text-align: center; animation: sig 2.4s forwards; }
  #sigPop b { display: block; font-size: 64px; line-height: 1; filter: drop-shadow(0 0 18px rgba(77, 243, 255, .8)); }
  #sigPop span { display: inline-block; margin-top: 8px; font-size: 22px; font-weight: 800; color: #fff; background: rgba(6, 12, 26, .7); border: 1px solid var(--cyan); border-radius: 14px; padding: 6px 16px; }
  #sigPop small { display: block; color: var(--cyan); font-size: 12px; margin-top: 4px; }
  #sigPop.danger b { filter: drop-shadow(0 0 22px rgba(255, 60, 80, .9)); } #sigPop.danger span { border-color: var(--red); color: #ffd0d6; }
  @keyframes sig { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 8% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 14% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop { from { transform: translateX(-50%) scale(.7); opacity: 0; } }
  #hTip { position: absolute; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: min(560px, calc(100vw - 24px)); text-align: center; font-size: 14px; line-height: 1.5;
    background: rgba(6, 12, 26, .82); border: 1px solid rgba(255, 183, 3, .45); color: #fff3cf; border-radius: 14px; padding: 8px 14px; }
  .ar #hTip, .ar #hInfo, .ar .bar label, .ar #hRole, .ar .toast, .ar #sigPop span { direction: rtl; }

  /* pilot controls */

  #tBtns { position: absolute; right: calc(12px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(2, auto); gap: 10px; justify-items: center; align-items: end; }
  .tb { width: 66px; height: 66px; border-radius: 50%; border: 2px solid rgba(77, 243, 255, .35); background: rgba(6, 14, 30, .72); color: var(--text); font-size: 24px; cursor: pointer;

  .tb kbd { position: absolute; top: 5px; font: 700 9px inherit; color: var(--muted); }
  #tStr { font-size: 13px; font-weight: 800; color: var(--cyan); }
  .lvb { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; margin-bottom: 2px; }
  .lvb i { display: block; width: 5px; border-radius: 2px; background: currentColor; opacity: .25; }
  .lvb i:nth-child(1) { height: 6px; } .lvb i:nth-child(2) { height: 11px; } .lvb i:nth-child(3) { height: 16px; } .lvb i.on { opacity: 1; }

  body:not(.touch) .tb { width: 54px; height: 54px; font-size: 20px; } body:not(.touch) .tb.big { width: 64px; height: 64px; font-size: 24px; }
  body:not(.touch) #tBoost, body:not(.touch) #tSig { display: none; }
  body:not(.canping) #tPing, body:not(.canping) #tStr { display: none; }
  body.canping #tSig, body.canping #piSig { display: none !important; }
  #joy { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 2px solid rgba(77, 243, 255, .35); background: radial-gradient(circle, rgba(77, 243, 255, .1), rgba(6, 14, 30, .25)); }

  body:not(.touch) #joyHint { display: none; }

  .sigbar { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; pointer-events: auto; background: rgba(6, 12, 26, .8); border: 1px solid var(--line); border-radius: 14px; padding: 5px; max-width: calc(100vw - 16px); }
  .sigbar button { background: var(--card); color: var(--text); border: 1px solid transparent; border-radius: 10px; min-width: 50px; padding: 4px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; }
  .sigbar button:hover { border-color: var(--cyan); } .sigbar button:active { background: var(--card2); }
  .sigbar b { font-size: 18px; line-height: 1.1; } .sigbar span { font-size: 10px; color: var(--muted); white-space: nowrap; } .sigbar kbd { position: absolute; top: 1px; left: 4px; font: 700 9px inherit; color: rgba(154, 163, 199, .7); }
  .sigbar button.danger b { color: var(--red); }

  body.touch #piSig:not(.open) { display: none; }
  body.touch .sigbar kbd { display: none; }

  /* sonar operator controls */
  #opUI { position: fixed; left: 0; right: 0; bottom: 0; z-index: 22; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 8px calc(8px + env(safe-area-inset-bottom)); }

  .seg { display: flex; gap: 3px; background: rgba(0, 0, 0, .3); border-radius: 11px; padding: 3px; }

  .seg button small { font-size: 9px; font-weight: 600; opacity: .7; }

  #opPing { position: relative; overflow: hidden; background: #5ff5d0; color: #03241a; border: 0; border-radius: 12px; padding: 6px 22px; font-size: 17px; font-weight: 900; cursor: pointer; min-width: 120px; box-shadow: 0 0 18px rgba(95, 245, 208, .4); }
  #opPing i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(0, 0, 0, .35); pointer-events: none; }
  #opPing.off { filter: grayscale(.8) brightness(.6); }

  /* screens */
  #scr { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 60px 14px 14px; overflow-y: auto; background: radial-gradient(ellipse at 50% 40%, rgba(2, 10, 20, .25), rgba(1, 4, 10, .72)); }
  #scr.dim { background: rgba(1, 4, 10, .66); }
  .panel { background: linear-gradient(180deg, rgba(14, 22, 44, .94), rgba(10, 14, 30, .95)); border: 1px solid rgba(77, 243, 255, .2); border-radius: 22px; padding: 20px; width: min(500px, 100%);
    display: flex; flex-direction: column; gap: 11px; box-shadow: 0 24px 80px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .05); margin: auto; animation: rise .3s ease-out; }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } }
  .ar .panel { direction: rtl; }
  .panel h2 { margin: 0; font-size: 22px; color: var(--accent); }
  .panel p { margin: 0; line-height: 1.6; color: #c9d0ee; font-size: 14px; }
  .muted { color: var(--muted) !important; font-size: 13px; }
  .btn { background: var(--accent); color: #1a1200; border: 0; border-radius: 13px; padding: 11px 16px; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform .1s, filter .1s; }
  .btn:hover { filter: brightness(1.08); } .btn:active { transform: scale(.98); }
  .btn.sec { background: var(--card2); color: var(--text); font-weight: 700; }
  .btn.cyan { background: linear-gradient(90deg, #36d7e8, #5ff5d0); color: #02232a; }
  .btn.big { font-size: 18px; padding: 14px 16px; }
  .btn.small { padding: 7px 11px; font-size: 13px; }
  .btn[disabled] { opacity: .45; cursor: default; filter: none; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > .grow { flex: 1; }
  .logo { text-align: center; position: relative; padding: 18px 0 6px; }
  .logo h1 { margin: 0; font-size: clamp(30px, 8vw, 44px); line-height: 1.1; font-weight: 900; letter-spacing: .5px;
    background: linear-gradient(180deg, #e8fdff 10%, #4df3ff 60%, #2a7fd6); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(77, 243, 255, .35)); }
  .logo .tag { color: #a9cde0; font-size: 14px; margin-top: 8px; }
  .emb { position: relative; width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 50%; background: radial-gradient(circle, #fff6d0 0 6%, #ffb703 14%, rgba(255, 183, 3, .15) 40%, rgba(77, 243, 255, .08) 70%); border: 2px solid rgba(77, 243, 255, .55); box-shadow: 0 0 24px rgba(77, 243, 255, .35); }
  .emb::after { content: ''; position: absolute; inset: 9px; border-radius: 50%; border: 1px dashed rgba(77, 243, 255, .45); }
  .rings { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  .rings i { position: absolute; left: -32px; top: -32px; width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(77, 243, 255, .45); animation: ring 3.6s infinite ease-out; opacity: 0; }
  .rings i:nth-child(2) { animation-delay: 1.2s; } .rings i:nth-child(3) { animation-delay: 2.4s; }
  @keyframes ring { 0% { transform: scale(.9); opacity: .7; } 100% { transform: scale(3.4); opacity: 0; } }
  .menu .btn { width: 100%; }
  .foot { display: flex; justify-content: center; gap: 16px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .foot b { color: var(--accent); }
  .lvls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .lv { background: var(--card); border: 1px solid rgba(77, 243, 255, .14); border-radius: 14px; padding: 9px 6px; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 92px; }
  .lv:hover:not([disabled]) { border-color: var(--accent); background: var(--card2); }
  .lv b { font-size: 22px; color: var(--cyan); } .lv span { font-size: 11px; text-align: center; line-height: 1.3; } .lv i { font-style: normal; letter-spacing: 1px; font-size: 13px; } .lv i span { color: #3a3550; font-size: 13px; } .lv i span.on { color: #d08cff; text-shadow: 0 0 8px rgba(208, 140, 255, .6); } .lv small { color: var(--muted); font-size: 10px; }
  .lv[disabled] { opacity: .45; cursor: default; } .lv[disabled] b { color: var(--muted); }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .role { background: var(--card); border: 1px solid rgba(77, 243, 255, .18); border-radius: 16px; padding: 12px 10px; color: var(--text); cursor: pointer; display: flex; flex-direction: column; gap: 6px; text-align: start; }
  .role:hover { border-color: var(--accent); background: var(--card2); }
  .role .ri { font-size: 30px; } .role b { font-size: 15px; color: var(--accent); } .role span { font-size: 12px; color: var(--muted); line-height: 1.45; flex: 1; }
  .role em { font-style: normal; font-size: 13px; font-weight: 800; background: var(--accent); color: #1a1200; border-radius: 9px; padding: 6px; text-align: center; }
  .or { text-align: center; color: var(--muted); font-size: 12px; }
  input.code { flex: 1; min-width: 0; font: 700 20px inherit; font-family: inherit; letter-spacing: 6px; text-transform: uppercase; text-align: center; background: var(--card2); color: var(--text); border: 2px solid transparent; border-radius: 12px; padding: 9px; direction: ltr; }
  input.code:focus { outline: none; border-color: var(--accent); }
  .msg { min-height: 18px; color: #ffb3bf; font-size: 13px; text-align: center; }
  .roomcode { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 10px 12px; flex-wrap: wrap; }
  .roomcode b { font-size: 30px; letter-spacing: 6px; color: var(--accent); direction: ltr; }
  .roomcode .grow { flex: 1; }
  .plist { display: flex; flex-direction: column; gap: 6px; }
  .pl { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 12px; padding: 9px 12px; }
  .pl .ri { font-size: 24px; } .pl div { display: flex; flex-direction: column; } .pl small { color: var(--muted); font-size: 12px; }
  .pl.wait { color: var(--muted); font-size: 13px; justify-content: center; text-align: center; }

  .picker .grow { text-align: center; } .picker b { color: var(--cyan); display: block; } .picker small { color: var(--muted); }
  .picker button { width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--card2); color: var(--text); font-size: 18px; cursor: pointer; }
  .how { display: flex; flex-direction: column; gap: 9px; max-height: 58vh; overflow-y: auto; padding-inline-end: 4px; }
  .how div { background: var(--card); border-radius: 12px; padding: 9px 12px; }
  .how b { color: var(--accent); display: block; margin-bottom: 3px; font-size: 14px; } .how p { font-size: 13px; }

  .stars .on:nth-child(2) { animation-delay: .15s; } .stars .on:nth-child(3) { animation-delay: .3s; }
  @keyframes star { from { transform: scale(2.2) rotate(-30deg); opacity: 0; } }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
  .stats div { background: var(--card); border-radius: 12px; padding: 7px; display: flex; flex-direction: column; } .stats span { color: var(--muted); font-size: 12px; } .stats b { font-size: 18px; }
  .newbest { color: var(--accent); font-weight: 800; animation: blink .6s 4 alternate; }
  .btns { display: flex; flex-direction: column; gap: 8px; }

  .toasts { position: fixed; left: 50%; top: calc(108px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 45; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  .toast { background: rgba(6, 12, 26, .9); border: 1px solid var(--line); color: var(--text); padding: 8px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; animation: tin .25s; white-space: nowrap; max-width: calc(100vw - 20px); overflow: hidden; text-overflow: ellipsis; }
  @keyframes tin { from { transform: translateY(-8px); opacity: 0; } }

  @media (max-width: 640px), (max-height: 520px) {
    #hLeft { width: 150px; gap: 4px; }
    #hInfo { padding: 4px 8px; } #hInfo b { font-size: 12px; } #hInfo span { font-size: 10px; }

    .tb { width: 58px; height: 58px; font-size: 21px; } .tb.big { width: 72px; height: 72px; font-size: 26px; }
    #hTip { font-size: 12px; bottom: auto; top: calc(136px + env(safe-area-inset-top)); }

</style>

<body>
<canvas id="c"></canvas>
<div id="corner">
  <button id="bPause" title="Pause" hidden>⏸</button>
  <button id="bMute" title="Sound">🔊</button>
  <button id="bLang" class="txt">English</button>
  <button data-mal3ab-home title="Home">🏠</button>
  <button data-mal3ab-chat title="Chat">💬</button>
</div>
<div id="hud" hidden>
  <div id="hLeft">
