<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chrono Courier — Mal3ab</title>
<meta name="theme-color" content="#0f1220">
<style>
  :root { --bg: #0f1220; --card: #161b33; --card2: #232a4d; --text: #eef0ff; --muted: #9aa3c7; --accent: #ffb703; --cyan: #3cf2d0; --pink: #ff5fa2; --red: #ff5d73; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070914; color: var(--text); font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

  /* top bar */
  #top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right));
    display: flex; align-items: center; gap: 8px; z-index: 6; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .grp { display: flex; gap: 4px; align-items: center; background: rgba(13, 16, 32, .86); border: 1px solid rgba(255, 255, 255, .07); border-radius: 14px; padding: 4px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .3); }
  .ib { background: var(--card2); color: var(--text); border: 0; border-radius: 10px; height: 36px; min-width: 36px; padding: 0 9px; font-size: 13px; font-weight: 700;
    font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; transition: background .15s, transform .1s; }
  .ib:hover:not(:disabled) { background: #2f3a6a; }
  .ib:active:not(:disabled) { transform: scale(.94); }
  .ib:disabled { opacity: .33; cursor: default; }
  .ib .ic { font-size: 16px; line-height: 1; }
  .brand { font-weight: 900; letter-spacing: .5px; padding: 0 6px 0 4px; white-space: nowrap; font-size: 15px; }
  .brand b { color: var(--accent); }
  #mid { flex: 1; display: flex; justify-content: center; min-width: 0; pointer-events: none !important; }
  #lvlName { background: rgba(13, 16, 32, .8); border-radius: 12px; padding: 7px 14px; font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%; border: 1px solid rgba(255, 255, 255, .06); }
  #lvlName i { font-style: normal; color: var(--accent); margin: 0 4px; }

  /* banner + tip */
  #banner { position: fixed; left: 50%; transform: translateX(-50%); z-index: 5; pointer-events: none; padding: 7px 16px; border-radius: 999px; font-weight: 800; font-size: 14px;
    background: rgba(10, 13, 28, .88); border: 1px solid rgba(60, 242, 208, .35); color: #dffcf6; box-shadow: 0 0 22px rgba(60, 242, 208, .18); white-space: nowrap; max-width: calc(100vw - 24px);
    overflow: hidden; text-overflow: ellipsis; }
  #banner.pulse { animation: pulse 1.4s ease-in-out infinite; }
  #banner.bad { border-color: rgba(255, 93, 115, .6); color: #ffd9de; box-shadow: 0 0 22px rgba(255, 93, 115, .25); }
  #banner.warn { border-color: rgba(255, 183, 3, .55); color: #ffe9b0; }
  @keyframes pulse { 50% { opacity: .55; } }
  #tip { position: fixed; left: 50%; transform: translateX(-50%); z-index: 7; width: min(560px, calc(100vw - 20px)); background: rgba(20, 25, 50, .96); border: 1px solid rgba(255, 183, 3, .35);
    border-radius: 14px; padding: 10px 38px 10px 14px; font-size: 14px; line-height: 1.55; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); cursor: pointer; animation: tipIn .35s ease-out; }
  #tip b { color: var(--accent); }
  #tip .x { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
  .ar #tip { direction: rtl; padding: 10px 14px 10px 38px; } .ar #tip .x { right: auto; left: 8px; }
  @keyframes tipIn { from { opacity: 0; transform: translate(-50%, -8px); } }

  /* touch controls */
  #pad { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  #dpad { position: absolute; width: 156px; height: 156px; pointer-events: auto; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); }
  #dpad button, #acts button { position: absolute; border: 1px solid rgba(255, 255, 255, .14); color: #fff; font-family: inherit; touch-action: none; cursor: pointer; }
  #dpad button { width: 54px; height: 54px; border-radius: 15px; background: rgba(35, 42, 77, .82); font-size: 20px; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
  #dpad button.on { background: rgba(60, 242, 208, .45); transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
  #dpad .u { left: 51px; top: 0; } #dpad .d { left: 51px; bottom: 0; } #dpad .l { left: 0; top: 51px; } #dpad .r { right: 0; top: 51px; }
  #dpad .hub { position: absolute; left: 58px; top: 58px; width: 40px; height: 40px; border-radius: 50%; background: rgba(13, 16, 32, .7); border: 1px solid rgba(255, 255, 255, .08); }
  #acts { position: absolute; width: 150px; height: 156px; pointer-events: auto; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); }
  #actb { right: 0; bottom: 18px; width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffd866, #ff9f1c 70%); color: #2a1700; font-weight: 900;
    font-size: 30px; box-shadow: 0 5px 0 #a35f00, 0 0 24px rgba(255, 183, 3, .35); }
  #actb.on { transform: translateY(3px); box-shadow: 0 2px 0 #a35f00; }
  #actb small { display: block; font-size: 11px; margin-top: -2px; }
  #endb { left: 0; top: 0; width: 56px; height: 44px; border-radius: 13px; background: rgba(35, 42, 77, .82); font-size: 18px; }
  #pad.side #dpad { bottom: 50%; transform: translateY(50%); }
  #pad.side #acts { bottom: 50%; transform: translateY(50%); }

  /* overlays */
  #ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; background: rgba(4, 6, 14, .6); padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top)); }
  #ov.clear { background: radial-gradient(ellipse at center, rgba(4, 6, 14, .15), rgba(4, 6, 14, .55)); }
  .box { background: linear-gradient(180deg, rgba(27, 33, 64, .97), rgba(15, 19, 39, .97)); border: 1px solid rgba(255, 255, 255, .08); border-radius: 22px; padding: 20px;
    width: min(440px, 100%); max-height: calc(100vh - 32px); overflow: auto; text-align: center; box-shadow: 0 24px 70px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .06);
    animation: boxIn .28s cubic-bezier(.2, 1.3, .4, 1); touch-action: pan-y; }
  .box.wide { width: min(640px, 100%); }
  @keyframes boxIn { from { opacity: 0; transform: scale(.92) translateY(10px); } }
  .ar .box { direction: rtl; }
  .box h2 { margin: 2px 0 10px; font-size: 24px; color: var(--accent); }
  .box p { color: var(--muted); line-height: 1.6; margin: 6px 0 12px; font-size: 14px; }
  .logo { font-weight: 900; font-size: clamp(34px, 9vw, 52px); line-height: 1; letter-spacing: 1px; margin: 4px 0 2px;
    background: linear-gradient(90deg, #3cf2d0, #ffb703 48%, #ff5fa2); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(255, 183, 3, .3)); direction: ltr; }
  .sub { color: #c9d0f5; font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .who { color: var(--cyan); font-weight: 700; font-size: 13px; margin: 6px 0 0; }
  .col { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .btn { background: var(--accent); color: #1d1300; border: 0; border-radius: 13px; padding: 12px 18px; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 0 #b37e00; transition: transform .1s, filter .15s; }
  .btn:hover { filter: brightness(1.08); } .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b37e00; }
  .btn.sec { background: var(--card2); color: var(--text); box-shadow: 0 4px 0 #11152b; }
  .btn.sm { padding: 8px 13px; font-size: 14px; border-radius: 11px; }
  .stars-total { color: var(--accent); font-weight: 800; margin-top: 10px; font-size: 14px; }
  .lvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 9px; margin-top: 12px; }
  .lv { background: var(--card2); border: 2px solid transparent; border-radius: 14px; padding: 10px 6px 8px; cursor: pointer; color: var(--text); font-family: inherit; display: flex; flex-direction: column;
    align-items: center; gap: 3px; transition: transform .12s, border-color .15s; }
  .lv:hover:not(.locked) { transform: translateY(-2px); border-color: rgba(255, 183, 3, .5); }
  .lv .n { font-size: 24px; font-weight: 900; line-height: 1.1; }
  .lv .nm { font-size: 11.5px; color: var(--muted); min-height: 28px; display: flex; align-items: center; line-height: 1.2; }
  .lv .st { color: var(--accent); letter-spacing: 1px; font-size: 15px; }
  .lv .st i { color: #3b4470; font-style: normal; }
  .lv.locked { opacity: .38; cursor: default; }
  .lv.next { border-color: rgba(60, 242, 208, .6); box-shadow: 0 0 16px rgba(60, 242, 208, .18); }
  .howto { text-align: start; display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .howto div { background: rgba(255, 255, 255, .04); border-radius: 11px; padding: 8px 11px; font-size: 14px; line-height: 1.5; }
  .howto .k { color: var(--muted); font-size: 13px; }
  .bigstars { font-size: 46px; letter-spacing: 6px; margin: 4px 0 2px; direction: ltr; }
  .bigstars span { display: inline-block; color: #343c63; transform: scale(.4); opacity: 0; animation: starIn .45s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  .bigstars span.on { color: var(--accent); text-shadow: 0 0 18px rgba(255, 183, 3, .7); }
  @keyframes starIn { to { transform: scale(1); opacity: 1; } }
  .small { font-size: 12.5px; color: var(--muted); }

  @media (max-width: 760px), (pointer: coarse) and (max-height: 500px) {
    .ib .tx { display: none; }
    .brand .nm { display: none; }
    #lvlName { font-size: 13px; padding: 6px 10px; }
  }
  @media (max-width: 560px) { body.playing .brand { display: none; } }
  @media (max-width: 420px) {
    .ib { min-width: 34px; height: 34px; padding: 0 7px; }
    #top { gap: 5px; }
    .grp { padding: 3px; gap: 3px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../shared/i18n.js?v=1793381184"></script>
<script src="../../shared/net.js?v=1793381184"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="grp">
    <button class="ib" data-mal3ab-home title="Home">🏠</button>
    <button class="ib" data-mal3ab-chat title="Chat">💬</button>
    <span class="brand" id="brand"><span>⏳</span><span class="nm"> <b>Chrono</b> Courier</span></span>
  </div>
  <div id="mid"><div id="lvlName" hidden></div></div>
  <div class="grp" id="playBtns" hidden>
    <button class="ib" id="bHint"><span class="ic">💡</span></button>
    <button class="ib" id="bRestart"><span class="ic">↺</span><span class="tx" data-i18n="cc_restartLoop"></span></button>
    <button class="ib" id="bUndo"><span class="ic">⏮</span><span class="tx" data-i18n="cc_undoLoop"></span></button>
    <button class="ib" id="bEnd"><span class="ic">⏭</span><span class="tx" data-i18n="cc_endLoop"></span></button>
    <button class="ib" id="bPause"><span class="ic">❚❚</span></button>
  </div>
  <div class="grp" id="menuBtns">
    <button class="ib" id="bSound"></button>
    <button class="ib" id="bLang"></button>
  </div>
</div>
<div id="banner" hidden></div>
<div id="tip" hidden></div>
<div id="pad" hidden>
  <div id="dpad"><div class="hub"></div><button class="u" data-d="1">▲</button><button class="r" data-d="2">▶</button><button class="d" data-d="3">▼</button><button class="l" data-d="4">◀</button></div>
  <div id="acts"><button id="endb">⏭</button><button id="actb">✋<small></small></button></div>
</div>
<div id="ov" hidden></div>
<script src="engine.js?v=1793381184"></script>
<script src="game.js?v=1793381184"></script>
<script src="../../shared/cloud.js?v=1793381184" data-game="chrono-courier" data-keys="chrono-courier-*"></script>
<script>
  document.querySelectorAll('[data-mal3ab-home]').forEach(h => { if (!h.onclick) h.onclick = () => location.href = '../../play.html'; });
</script>
</body>
</html>
