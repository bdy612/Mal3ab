const esc = (v) => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const opt = (v, label) => `<option value="${v}">${label}</option>`;
const page = document.getElementById('page');
const rpcErr = (e) => /Could not find the function|schema cache/i.test((e && e.message) || '') ? t('acc_notReady') : (e && e.message) || String(e);
function msg(id, text, bad) { const el = document.getElementById(id); el.className = bad ? 'err' : 'ok'; el.textContent = text; }

function draw() {
  document.getElementById('langslot').innerHTML = langButton();
  applyLang();
  const p = Auth.profile;
  if (!p) { page.innerHTML = `<div class="panel2"><p>${t('loginFirst')}</p><a class="btn" href="play.html">${t('home')}</a></div>`; return; }
  page.innerHTML = `
    <div class="panel2">
      <h2>${t('acc_idT')}</h2>
      <div class="row2" style="flex-wrap:wrap;gap:12px"><b style="font-size:30px;letter-spacing:1px;color:var(--accent);direction:ltr;unicode-bidi:isolate">#${p.public_id || '…'}</b>
        <button class="btn small secondary" id="cpId" onclick="copyId()">${t('acc_copy')}</button></div>
      <small style="color:var(--muted)">${t('acc_idHint')}</small>
      <div style="margin-top:10px"><b>${t('acc_tags')}:</b> ${(p.tags || []).length ? Mal3abTags(p.tags) : `<small style="color:var(--muted)">${t('acc_noTags')}</small>`}</div>
    </div>
    <div class="panel2">
      <h2>${t('acc_findT')}</h2>
      <div class="row2"><input class="text" id="findQ" placeholder="${t('acc_findPh')}" maxlength="24" onkeydown="if(event.key==='Enter')findPlayers()"><button class="btn small" onclick="findPlayers()">${t('acc_find')}</button></div>
      <div id="findRes" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"></div>
    </div>
    <div class="panel2">
      <h2>${t('picture')}</h2>
      <div class="row2">${avatarHtml(p, 96)}
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn small" onclick="document.getElementById('file').click()">${t('changePicture')}</button>
          ${p.avatar ? `<button class="btn small secondary" onclick="removePic()">${t('removePicture')}</button>` : ''}
          <small style="color:var(--muted)">${t('pictureHint')}</small>
        </div></div>
      <div id="m-pic"></div>
    </div>
    <div class="panel2">
      <h2>${t('username')}</h2>
      <div class="row2"><input class="text" id="uname" value="${p.username}" maxlength="20"><button class="btn small" onclick="saveName()">${t('save')}</button></div>
      <div id="m-name"></div>
    </div>
    <div class="panel2">
      <h2>${t('language')}</h2>
      <div class="row2"><select id="lang"><option value="ar"${getLang() === 'ar' ? ' selected' : ''}>${t('arabic')}</option><option value="en"${getLang() === 'en' ? ' selected' : ''}>${t('english')}</option></select></div>
      <div id="m-lang"></div>
    </div>
    <div class="panel2">
      <h2>${t('changePassword')}</h2>
      <input class="text" type="password" id="pw0" placeholder="${t('currentPassword')}">
      <input class="text" type="password" id="pw1" placeholder="${t('newPassword')}">
      <input class="text" type="password" id="pw2" placeholder="${t('confirmPassword')}">
      <div class="row2"><button class="btn small" onclick="savePw()">${t('save')}</button></div>
      <div id="m-pw"></div>
    </div>
    <div class="panel2">
      <h2>${t('stats')}</h2>
      <div class="row2"><b>${p.wins}</b> ${t('wins')} · <b>${p.losses}</b> ${t('losses')} · <b>${p.draws}</b> ${t('draws')}
        <a class="btn small secondary" href="history.html" style="margin-inline-start:auto">${t('history')}</a>
        ${p.is_admin ? `<a class="btn small" href="admin.html">${t('admin')}</a>` : ''}</div>
    </div>
    <div class="panel2" id="repBox">
      <h2>${t('acc_repT')}</h2>
      <div class="row2"><select id="repCat">${['player', 'chat', 'bug', 'other'].map(c => opt(c, t('acc_cat_' + c))).join('')}</select>
        <input class="text" id="repWho" placeholder="${t('acc_repWho')}" maxlength="10" inputmode="numeric" style="flex:1;min-width:160px"></div>
      <textarea class="text" id="repBody" maxlength="2000" rows="3" placeholder="${t('acc_repBody')}" style="width:100%;resize:vertical"></textarea>
      <div class="row2"><button class="btn small" onclick="sendReport()">${t('acc_repSend')}</button></div>
      <div id="m-rep"></div>
    </div>
    <div class="panel2">
      <h2>${t('acc_ideaT')}</h2>
      <small style="color:var(--muted)">${t('acc_ideaHint')}</small>
      <div class="row2"><select id="ideaCat">${['game', 'feature', 'change', 'other'].map(c => opt(c, t('acc_icat_' + c))).join('')}</select></div>
      <textarea class="text" id="ideaBody" maxlength="2000" rows="3" placeholder="${t('acc_ideaBody')}" style="width:100%;resize:vertical"></textarea>
      <div class="row2"><button class="btn small" onclick="sendIdea()">${t('acc_ideaSend')}</button></div>
      <div id="m-idea"></div>
    </div>
    <div class="panel2">
      <h2>${t('acc_tagT')}</h2>
      <small style="color:var(--muted)">${t('acc_tagHint')}</small>
      <div class="row2"><select id="tagWhich">${['famous', 'youtuber', 'vip'].map(c => opt(c, t('tag_' + c))).join('')}</select>
        <input class="text" id="tagProof" placeholder="${t('acc_tagProof')}" maxlength="500" style="flex:1;min-width:180px"></div>
      <div class="row2"><button class="btn small" onclick="askTag()">${t('acc_tagSend')}</button></div>
      <div id="m-tag"></div>
    </div>
    <div class="panel2">
      <h2>${t('acc_mineT')}</h2>
      <div id="mine" style="display:flex;flex-direction:column;gap:8px"><small style="color:var(--muted)">…</small></div>
    </div>
    ${p.is_admin ? '' : `<div class="panel2">
      <h2>🛡️ ${t('acc_adminT')}</h2>
      <div id="adm-state" style="color:var(--muted)"></div>
      <div id="adm-form"><textarea class="text" id="admWhy" maxlength="300" rows="2" placeholder="${t('acc_adminWhy')}" style="width:100%;resize:vertical"></textarea>
      <div class="row2"><button class="btn small" onclick="askAdmin()">${t('acc_adminSend')}</button></div></div>
      <div id="m-adm"></div>
    </div>`}
    <div class="panel2" style="border:1px solid #e5484d55">
      <h2 style="color:#ff6b6b">⚠️ ${t('acc_delT')}</h2>
      <p style="color:var(--muted);margin:0 0 8px">${t('acc_delWarn')}</p>
      ${p.is_owner ? `<div class="err">${t('acc_delOwner')}</div>` : `<input class="text" type="password" id="delPw" placeholder="${t('acc_delPw')}" autocomplete="current-password">
      <div class="row2"><button class="btn small" style="background:#e5484d;color:#fff" onclick="deleteMe()">${t('acc_delBtn')}</button></div>`}
      <div id="m-del"></div>
    </div>`;
  if (!p.is_admin) loadAdminReq();
  loadMine();
  const want = new URLSearchParams(location.search).get('report');   // ?report=<player ID> from the chat / search
  if (want && /^\d+$/.test(want)) { document.getElementById('repWho').value = want; document.getElementById('repCat').value = 'player'; document.getElementById('repBox').scrollIntoView({ block: 'center' }); }
  document.getElementById('lang').onchange = async (e) => {
    try { await Auth.update({ lang: e.target.value }); setLang(e.target.value); } catch (err) { msg('m-lang', err.message, true); }
  };
}

function copyId() {
  const b = document.getElementById('cpId'); navigator.clipboard.writeText(String(Auth.profile.public_id)).then(() => { b.textContent = t('acc_copied'); setTimeout(() => b.textContent = t('acc_copy'), 1400); }).catch(() => {});
}
// ---------- find players by ID or name ----------
let FOUND = [];
async function findPlayers() {
  const q = document.getElementById('findQ').value.trim(), box = document.getElementById('findRes'); if (!q) return;
  box.innerHTML = '<small style="color:var(--muted)">…</small>';
  try { FOUND = await Players.find(q) || []; } catch (e) { box.innerHTML = `<div class="err">${esc(rpcErr(e))}</div>`; return; }
  drawFound();
}
function drawFound() {
  const box = document.getElementById('findRes'); if (!box) return;
  if (!FOUND.length) { box.innerHTML = `<small style="color:var(--muted)">${t('acc_none')}</small>`; return; }
  box.innerHTML = FOUND.map(u => `<div class="row2" style="gap:10px;padding:10px;background:var(--card2);border-radius:12px;flex-wrap:wrap">${avatarHtml(u, 40)}
    <div style="flex:1;min-width:150px"><b dir="auto">${esc(u.username)}</b> <small style="color:var(--muted);direction:ltr;unicode-bidi:isolate">#${u.public_id}</small>
      <small style="color:${u.online ? '#80ed99' : 'var(--muted)'}"> · ● ${t(u.online ? 'acc_on' : 'acc_off')}</small><div>${Mal3abTags(u.tags, true)}</div></div>
    ${u.friend === 'me' ? `<small style="color:var(--muted)">${t('acc_you')}</small>` : `
      ${u.friend === 'friend' ? `<span class="btn tiny secondary" style="pointer-events:none">${t('acc_friend')}</span>` : u.friend === 'sent' ? `<span class="btn tiny secondary" style="pointer-events:none">${t('acc_sent')}</span>`
        : u.friend === 'incoming' ? `<a class="btn tiny" href="play.html">${t('acc_incoming')}</a>` : `<button class="btn tiny" onclick="addById(${u.public_id})">${t('acc_add')}</button>`}
      <button class="btn tiny secondary" onclick="talkTo('${u.id}')">${t('acc_msg')}</button>
      <button class="btn tiny secondary" onclick="reportId(${u.public_id})">${t('acc_report')}</button>`}</div>`).join('');
}
async function addById(pid) {
  try { await Friends.request('#' + pid); const u = FOUND.find(x => x.public_id === pid); if (u) u.friend = 'sent'; drawFound(); }
  catch (e) { document.getElementById('findRes').insertAdjacentHTML('afterbegin', `<div class="err">${esc(Mal3abErr(e))}</div>`); }
}
function talkTo(id) { const u = FOUND.find(x => x.id === id); if (window.Chat && Chat.showUser) Chat.showUser(u); }
function reportId(pid) { document.getElementById('repWho').value = pid; document.getElementById('repCat').value = 'player'; document.getElementById('repBox').scrollIntoView({ behavior: 'smooth', block: 'center' }); document.getElementById('repBody').focus(); }
// ---------- reports, ideas, verified tags ----------
async function sendReport() {
  const body = document.getElementById('repBody').value.trim(), who = document.getElementById('repWho').value.trim().replace('#', ''), cat = document.getElementById('repCat').value;
  if (body.length < 3) { document.getElementById('repBody').focus(); return; }
  try {
    let target = null;
    if (who) { const r = await Players.find('#' + who); if (!r || !r[0]) { msg('m-rep', t('err_noPlayer'), true); return; } target = r[0].id; }
    await Players.report(body, cat, target);
    document.getElementById('repBody').value = ''; document.getElementById('repWho').value = ''; msg('m-rep', t('acc_repSent')); loadMine();
  } catch (e) { msg('m-rep', Mal3abErr(rpcErr(e)), true); }
}
async function sendIdea() {
  const body = document.getElementById('ideaBody').value.trim(); if (body.length < 3) { document.getElementById('ideaBody').focus(); return; }
  try { await Players.idea(body, document.getElementById('ideaCat').value); document.getElementById('ideaBody').value = ''; msg('m-idea', t('acc_ideaSent')); loadMine(); }
  catch (e) { msg('m-idea', Mal3abErr(rpcErr(e)), true); }
}
async function askTag() {
  const proof = document.getElementById('tagProof').value.trim(); if (proof.length < 3) { document.getElementById('tagProof').focus(); return; }
  try { await Players.askTag(document.getElementById('tagWhich').value, proof); document.getElementById('tagProof').value = ''; msg('m-tag', t('acc_tagSent')); loadMine(); }
  catch (e) { msg('m-tag', rpcErr(e), true); }
}
async function loadMine() {
  const box = document.getElementById('mine'); if (!box) return;
  let d; try { d = await Players.mine(); } catch (e) { box.innerHTML = `<small style="color:var(--muted)">${esc(rpcErr(e))}</small>`; return; }
  const rows = [...(d.feedback || []).map(f => ({ ...f, k: f.kind })), ...(d.tag_requests || []).map(r => ({ ...r, k: 'tag', body: t('tag_' + r.tag) + ' — ' + r.proof }))]
    .sort((a, b) => new Date(b.at) - new Date(a.at));
  box.innerHTML = rows.length ? rows.map(r => `<div style="padding:10px;background:var(--card2);border-radius:12px">
      <div class="row2" style="gap:8px;flex-wrap:wrap"><b>${t('acc_kind_' + r.k)}</b>${r.target ? `<small style="color:var(--muted)">→ ${esc(r.target)} #${r.target_public_id}</small>` : ''}
        <small style="margin-inline-start:auto">${t('acc_st_' + r.status)}</small><small style="color:var(--muted)">${new Date(r.at).toLocaleDateString(getLang() === 'ar' ? 'ar-EG' : 'en-GB')}</small></div>
      <div dir="auto" style="margin-top:4px;white-space:pre-wrap;word-break:break-word">${esc(r.body)}</div>
      ${r.note ? `<div dir="auto" style="margin-top:6px;padding:6px 10px;border-inline-start:3px solid var(--accent);color:var(--muted)"><b>${t('acc_reply')}:</b> ${esc(r.note)}</div>` : ''}</div>`).join('')
    : `<small style="color:var(--muted)">${t('acc_mineNone')}</small>`;
}
async function saveName() {
  try { await Auth.update({ username: document.getElementById('uname').value.trim() }); draw(); msg('m-name', t('saved')); }
  catch (e) { msg('m-name', e.message, true); }
}
async function savePw() {
  const a = document.getElementById('pw0').value, b = document.getElementById('pw1').value, c = document.getElementById('pw2').value;
  if (b !== c) { msg('m-pw', t('passwordsDontMatch'), true); return; }
  try { await Auth.changePassword(a, b); ['pw0', 'pw1', 'pw2'].forEach(id => document.getElementById(id).value = ''); msg('m-pw', t('passwordChanged')); }
  catch (e) { msg('m-pw', e.message, true); }
}
async function loadAdminReq() {
  try {
    const { data, error } = await sb.rpc('my_admin_request', { p_token: Auth.token }); if (error) throw error;
    const st = document.getElementById('adm-state'), form = document.getElementById('adm-form'); if (!st) return;
    st.textContent = !data ? '' : data.status === 'pending' ? t('acc_adminPending') : data.status === 'declined' ? t('acc_adminDeclined') : t('acc_adminApproved');
    form.hidden = !!data && data.status === 'pending';
  } catch (e) {}
}
async function askAdmin() {
  try { const { error } = await sb.rpc('request_admin', { p_token: Auth.token, p_reason: document.getElementById('admWhy').value.trim() }); if (error) throw error;
    msg('m-adm', t('acc_adminSent')); loadAdminReq(); } catch (e) { msg('m-adm', rpcErr(e), true); }
}
async function deleteMe() {
  const pw = document.getElementById('delPw').value; if (!pw) { document.getElementById('delPw').focus(); return; }
  if (!confirm(t('acc_delSure', { p: Auth.profile.username }))) return;
  try {
    const { error } = await sb.rpc('delete_my_account', { p_token: Auth.token, p_password: pw }); if (error) throw error;
    try { localStorage.removeItem('mal3ab_token'); } catch (e) {} Auth.token = null;
    alert(t('acc_deleted')); location.href = 'play.html';
  } catch (e) { msg('m-del', rpcErr(e), true); }
}
async function removePic() { try { await Auth.update({ clearAvatar: true }); draw(); } catch (e) { msg('m-pic', e.message, true); } }

// shrink the picture to a 128×128 square (center crop) before saving it on the account
document.getElementById('file').onchange = (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const img = new Image();
  img.onload = async () => {
    const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
    const side = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
    URL.revokeObjectURL(img.src);
    try { await Auth.update({ avatar: c.toDataURL('image/jpeg', 0.85) }); draw(); msg('m-pic', t('saved')); } catch (err) { msg('m-pic', err.message, true); }
  };
  img.onerror = () => msg('m-pic', 'Not an image', true);
  img.src = URL.createObjectURL(f);
};
document.addEventListener('langchange', draw);
Auth.init().then(draw);
</script>
